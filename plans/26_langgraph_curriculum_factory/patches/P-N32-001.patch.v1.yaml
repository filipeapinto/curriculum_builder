  real: wire your own engine into the one production compile point too.\n\n`runtime/langgraph_factory/graph.py`'s\
  \ `build_curriculum_factory_graph()`\ncurrently reads:\n\n    bindings = unit_repair_binding_inventory()\n\
  \    register_skeleton(builder, bindings)\n    register_unit_repair_topology(builder,\
  \ sorted(bindings))\n    saver, _connection = open_checkpoint_saver(output_root)\n\
  \    return builder.compile(checkpointer=saver, name=GRAPH_NAME)\n\nTwo changes\
  \ close F2, using machinery that already exists and already does\nexactly what's\
  \ needed \u2014 read `full_binding_inventory()` and `register_\nworkbook_topology()`\
  \ in full before changing anything, both already compose\ncorrectly for this:\n\n\
  1. Compile against `full_binding_inventory()` instead of `unit_repair_\n   binding_inventory()`\
  \ for the `register_skeleton`/`register_unit_repair_\n   topology` calls. `full_binding_inventory()`\
