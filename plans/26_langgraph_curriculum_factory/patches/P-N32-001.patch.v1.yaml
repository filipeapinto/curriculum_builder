  \ \u2014 once D24-D32's\n   bodies are in the `bindings` that `register_skeleton`\
  \ passes to `unit_graph\n   .register_unit_path`, the one remaining DEFERRED_EDGES\
  \ row you own \u2014\n   `(D05_SELECT_NEXT_UNIT, manifest_exhausted) -> D24_PROVE_EXACT_MANIFEST_\n\
  \   COVERAGE` \u2014 resolves automatically, exactly the way N31's six rows did.\n\
  \   You do not need to (and must not) edit `unit_graph.py`.\n2. Call `register_workbook_topology(builder)`\
  \ immediately after `register_\n   unit_repair_topology(builder, ...)`, before `open_checkpoint_saver`.\
  \ This\n   function already exists and is already correct (your own topology test\n\
  \   already proves it works when called directly) \u2014 it wires D24-D32's own\n\
  \   internal loop (D24 through D32, including the retest/repair reuse of\n   `repair.py`'s\
  \ engine and the `D90`/`D91`/`D98`/M07/M08 resolution against\n   the full merged\
  \ node set) additively over the builder `register_skeleton`\n   and `register_unit_repair_topology`\
  \ already populated. Do not change its\n   own body; only add the call site.\n\n\
  Do not change `binding_inventory()` or `unit_repair_binding_inventory()`'s\nown\
  \ return values \u2014 both must stay exactly as N31 left them (N30's and N31's\n\
  own frozen tests independently recompute expectations from them). `full_\nbinding_inventory()`\
  \ is the one function meant to widen further, and it\nalready does.\n\n## Required\
