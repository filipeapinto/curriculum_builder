  \  workbook `COMPLETE` terminal for a manifest whose units are all accepted,\n \
  \ proving the whole chain (D05 exhaustion -> D24 coverage -> D25 through\n  D32)\
  \ actually executes, not just that the nodes exist.\n- No `UnitTopologyError`/`GraphBindingError`\
