# This is the v2 execution package: a corrected recovery of the v1 attempt
# that reached BLOCKED at N20_PROVIDER_TRANSPORT
# (plans/27_langgraph_curriculum_factory_remediation/results/N20_PROVIDER_TRANSPORT.result.v1.json,
# findings N20-F01, N20-F02, N20-F03, N20-F04, N20-F06). v1's N00-N20 results
# and evidence, and implementation.graph.v1.yaml itself, are untouched,
# immutable, historical evidence — this document does not edit them and is
# not an in-place revision of them. It corrects exactly two structural
# defects the v1 attempt's own evidence proved:
#
#   N20-F01: the bare whole-tree forbidden-reference scan
#   (`check_forbidden_production_refs.py`, no --node) is unsatisfiable for
#   any node before the last one to touch a migration-affected test, because
#   it depends on every later node's not-yet-migrated files already being
#   clean. N20-N50 now use `--node <NODE_ID>` (controller/check_forbidden_production_refs.py,
#   extended by this same recovery task per n20_recovery.plan.v1.md's
#   Correction design, item 2). N60 alone still runs the bare whole-tree
#   scan as the final zero-occurrence denominator.
#
#   N20-F02: the frozen `anthropic`/`openai` authorization classes v3 §7.4
#   requires cannot be expressed while N20 (which owns the frozen route
#   table and the eight job schemas) and N30 (which v1 assigned egress.py
#   and its provider allowlist to) are different write-set owners; N20 has
#   no path to change the allowlist its own routes must validate against.
#   `runtime/langgraph_factory/egress.py` and
#   `tests/runtime/test_plan26_egress.py` move from N30's write set to
#   N20's. N30 consumes that boundary read-only.
#
# No other node's write set, dependency edge, verification shape, or
# terminal changed. N10's admitted controller code is reused unmodified
# except for the --node extension named above, which n20_recovery.plan.v1.md
# explicitly directs as part of this correction, not a rewrite of N10's own
# scheduler/admission logic.
#
# Naming note: source_spec's filename ends in .v4.md, not .v3.md. The
# document is specification v3 (its own header/status line says so, and it
# corrects v2 exactly as the recovery plan requires); .v4 is the
# qa-gate-codex-run skill's own internal round-lineage numbering
# (plans/26_langgraph_curriculum_factory/spec/v3/QA/), which bumps on every
# QA fix round regardless of the document's own version identity. Round 1
# (against a file then named .v3.md) found one major finding (SPEC3-QA-001,
# an overclaimed "proven live" for stdin projection delivery); the fix was
# submitted as round 2 under this tool-assigned name and passed. The
# round-1 file is preserved at spec/v3/deprecated/langgraph_curriculum_factory.spec.v3.md.

rules:
  success_requires_schema_bound_result: true
  preserve_plan26_history: true
  invalidate_all_descendants_on_ancestor_change: true
  markdown_status_is_authority: false
  allow_parallel_ready_nodes: false
  max_attempts_per_finding: 3
  live_proof_required_for_activation: true
  frozen_before_entry:
    - plans/27_langgraph_curriculum_factory_remediation/schemas/node_result.schema.v1.json
  forbidden_production_scan:
    scan_roots:
      - runtime/langgraph_factory
      - runtime/run_curriculum.py
      - policy/routes.v1.yaml
      - policy/routing/model_registry.v1.yaml
      - schemas/routes.schema.v1.json
      - schemas/model_registry.schema.v1.json
    excluded_globs:
      - "**/__pycache__/**"
      - "**/*.pyc"
    excluded_roots:
      - plans
      - tests
      - outputs
    prohibited_dispatch_or_import_terms:
      - gemini
      - google.generativeai
    prohibited_credential_names:
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
    credential_absence_guard_paths:
      - runtime/run_curriculum.py
      - runtime/langgraph_factory/transport.py
    credential_occurrence_policy: >-
      Credential names may appear only in explicit absence/denial guards inside
      runtime/run_curriculum.py or runtime/langgraph_factory/transport.py; they
      may never configure, authenticate, authorize, dispatch, or provide fallback.
  retired_provider_test_scan:
    scan_roots:
      - tests/runtime
    excluded_globs:
      - "**/__pycache__/**"
      - "**/*.pyc"
    prohibited_terms:
      - gemini
      - google
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
    occurrence_policy: zero_occurrences_in_active_test_source

