      - plans/27_langgraph_curriculum_factory_remediation/results/N00_SPEC_APPROVAL_GATE.result.v1.json
      - plans/27_langgraph_curriculum_factory_remediation/results/evidence/N00_SPEC_APPROVAL_GATE
    verification:
