schema_version: 1
kind: integration_ownership
contract_id: run27-n40-integration-ownership-v1
node_id: N40_INTEGRATION_OWNERSHIP

# Machine-readable ownership matrix (N40 prompt item 2): every D-node body,
# registration seam, routing decision, and integration test that this node's
# six-file/four-test/one-contract write set is responsible for, checked
# against real repository bytes -- never taken on this document's word.
# Ownership claims (single_owner/owned_by_node) are checked against the
# active Run 27 graph's own write sets, so a future node accidentally
# claiming one of these six paths fails this contract, not just a review.

claims:
  # ---- file-level ownership: exactly one Run 27 node owns each module ----
  - {type: single_owner, path: runtime/langgraph_factory/graph.py}
  - {type: owned_by_node, path: runtime/langgraph_factory/graph.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: runtime/langgraph_factory/routing.py}
  - {type: owned_by_node, path: runtime/langgraph_factory/routing.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: runtime/langgraph_factory/unit_graph.py}
  - {type: owned_by_node, path: runtime/langgraph_factory/unit_graph.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: runtime/langgraph_factory/repair.py}
  - {type: owned_by_node, path: runtime/langgraph_factory/repair.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: runtime/langgraph_factory/acceptance.py}
  - {type: owned_by_node, path: runtime/langgraph_factory/acceptance.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: runtime/langgraph_factory/workbook.py}
  - {type: owned_by_node, path: runtime/langgraph_factory/workbook.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: tests/runtime/test_plan26_topology.py}
  - {type: owned_by_node, path: tests/runtime/test_plan26_topology.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: tests/runtime/test_plan26_unit_graph.py}
  - {type: owned_by_node, path: tests/runtime/test_plan26_unit_graph.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: tests/runtime/test_plan26_repair_acceptance.py}
  - {type: owned_by_node, path: tests/runtime/test_plan26_repair_acceptance.py, node: N40_INTEGRATION_OWNERSHIP}
  - {type: single_owner, path: tests/runtime/test_plan26_workbook.py}
  - {type: owned_by_node, path: tests/runtime/test_plan26_workbook.py, node: N40_INTEGRATION_OWNERSHIP}

  # ---- graph.py: the one production compile point and its registration seams ----
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: build_curriculum_factory_graph}
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: register_skeleton}
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: register_unit_repair_topology}
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: register_workbook_topology}
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: binding_inventory}
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: unit_repair_binding_inventory}
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: full_binding_inventory}
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: validate_bindings}
  - {type: symbol_defined, path: runtime/langgraph_factory/graph.py, symbol: _validate_topology}
