  # ---- retired-provider dispatch/credential terms, mirrored onto N40's own owned tests ----
  # (Deliberately narrower than a blanket "google" string-absence: graph.py's
  # own forbidden-import assertions in test_plan26_topology.py legitimately
  # *name* "google.generativeai" as a forbidden import -- the defect this
  # guards against is a live dispatch/credential reference, which scan_node.py
  # --node N40_INTEGRATION_OWNERSHIP (this node's own required verification
  # command, rules.retired_provider_test_scan) already checks with that exact
  # distinction. This claim only reinforces the credential-name half.)
  - {type: text_absent, path: tests/runtime/test_plan26_topology.py, pattern: "GEMINI_API_KEY|GOOGLE_API_KEY"}
  - {type: text_absent, path: tests/runtime/test_plan26_unit_graph.py, pattern: "GEMINI_API_KEY|GOOGLE_API_KEY"}
