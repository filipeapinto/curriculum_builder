  command: python3 plans/21_graph_engineered_subscription_execution/tools/validate_plan_v3.py
  self_test_command: python3 plans/21_graph_engineered_subscription_execution/tools/validate_plan_v3.py --self-test
contracts:
  test_receipt: contracts/test_receipt.schema.v3.json
  evidence_manifest: contracts/evidence_manifest.schema.v3.json
  phase_ledger: contracts/phase_ledger.schema.v3.json
  subtask_receipt: contracts/subtask_receipt.schema.v3.json
  p0_contract_bundle: contracts/p0_contract_bundle.schema.v3.json
  assurance_contract: contracts/assurance_contract.schema.v3.json
