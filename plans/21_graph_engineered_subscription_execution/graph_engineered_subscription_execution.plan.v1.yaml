review_protocol:
  independent_reviewers: 3
  roles: [graph_formalism_and_runtime, historical_regression_and_repository, prompt_execution_and_subscription_security]
  exit_rule: Approve only when all three independent reviewers report zero unresolved Critical or High findings and every finding has an evidence-backed disposition.
  iteration_rule: The author dispositions every finding with evidence, revises accepted findings, reruns validation, and repeats all three reviews for at most three rounds without using decreasing counts as correctness.
  design_qa_exhaustion:
    max_full_rounds: 3
    third_round_finding_status: UNAPPROVED_REMEDIATION_REQUIRED
    targeted_closure_rule: After round three, accepted findings may receive one reviewer-specific closure addendum against frozen remediated bytes; this is not a fourth full review.
    failed_closure_status: UNAPPROVED_REQUIRES_NEW_VERSION
