plan_version: "1.0"
id: graph_engineered_subscription_execution
status: qa
supersedes:
  - plans/20_subscription_only_execution_model/subscription_only_execution_model.plan.v1.md
bootstrap:
  validator: tools/validate_plan.py
  command: python3 plans/21_graph_engineered_subscription_execution/tools/validate_plan.py
  self_test_command: python3 plans/21_graph_engineered_subscription_execution/tools/validate_plan.py --self-test
  production_compiler_begins_after: P1
goal: >-
  Replace implicit and contradictory prompt orchestration with a compiled,
  durable, subscription-only execution graph in which Claude Code authors,
  Codex judges independently, deterministic code owns routing and acceptance,
  every model node is schema-bound, and every failure enters a bounded
  goal-test-targeted-repair loop or an honest terminal state.
constraints:
  - Planning does not authorize implementation; each phase prompt authorizes only its declared outputs.
  - The shipped deterministic bootstrap validator runs before P0; the production prompt-graph compiler begins only after P1 is implemented.
  - No production path may use a billed API key, raw model HTTP API, Gemini CLI, or hidden provider fallback.
  - One normalized worker adapter owns both Claude and Codex subprocess boundaries and receipt normalization.
  - Claude authoring requires unambiguous subscription entitlement plus structured claude -p output; current logged-out state pauses P2.
  - Codex judging records driver-bound requested identity honestly because CLI 0.147.0 does not expose a native executed-model field.
  - Generator and final judge use different provider drivers and model families; deterministic checks run before model judgment.
  - Models never own graph transitions, reducer behavior, checkpoint admission, failure classification, or terminal acceptance.
  - Existing outputs, Plan 18 through Plan 20 evidence, and unrelated dirty-worktree changes are immutable inputs.
  - Plan 19 is reconciled explicitly by contract digest and exact test disposition; it is never silently edited around.
  - Active runs remain pinned to graph, prompt, policy, schema, route, and model-registry digests.
  - The deterministic phase controller alone admits immutable result events and continuations; phases never self-authorize edges.
  - Each phase writes an immutable ledger and evidence artifacts; no phase appends a shared log.
controller:
  id: PHASE_CONTROLLER
  role: deterministic
  owner: phase_controller
  phase_event_path_template: plans/21_graph_engineered_subscription_execution/results/events/{node_id}.attempt-{attempt}.result.v1.yaml
  continuation_path_template: plans/21_graph_engineered_subscription_execution/results/continuations/{run_id}.{node_id}.attempt-{attempt}.v1.yaml
  resume_command_path_template: plans/21_graph_engineered_subscription_execution/results/resume_commands/{run_id}.{node_id}.attempt-{attempt}.v1.yaml
  authorized_outputs:
    - plans/21_graph_engineered_subscription_execution/results/events/{node_id}.attempt-{attempt}.result.v1.yaml
    - plans/21_graph_engineered_subscription_execution/results/continuations/{run_id}.{node_id}.attempt-{attempt}.v1.yaml
    - plans/21_graph_engineered_subscription_execution/results/resume_commands/{run_id}.{node_id}.attempt-{attempt}.v1.yaml
  schemas: [contracts/phase_result.schema.v1.json, contracts/continuation.schema.v1.json, contracts/resume_command.schema.v1.json]
  admission_checks: [current_run_binding, monotonic_attempt, predecessor_checkpoint_binding, pinned_policy_schema_route_binding, exact_required_tests, all_required_tests_pass, exact_required_artifacts, artifact_hash_recompute, legal_failure_mapping, continuation_command_binding, single_use_resume]
contract_registry:
  contract://anti_regression_sources: {owner: PLAN, resolver: anti_regression_sources, schema_ref: graph_engineered_subscription_execution.schema.v1.json}
  contract://P0/authorized_paths/P4/runtime_policy_schema: {owner: P0, resolver: authorized_paths.P4.runtime_policy_schema, schema_ref: contracts/baseline_contract.schema.v1.json}
  contract://P0/authorized_paths/P4/plan19_reconciliation: {owner: P0, resolver: authorized_paths.P4.plan19_reconciliation, schema_ref: contracts/baseline_contract.schema.v1.json}
  contract://P0/authorized_paths/P4/tests: {owner: P0, resolver: authorized_paths.P4.tests, schema_ref: contracts/baseline_contract.schema.v1.json}
  contract://P0/authorized_paths/P5/runtime_policy_schema: {owner: P0, resolver: authorized_paths.P5.runtime_policy_schema, schema_ref: contracts/baseline_contract.schema.v1.json}
  contract://P0/authorized_paths/P5/tests: {owner: P0, resolver: authorized_paths.P5.tests, schema_ref: contracts/baseline_contract.schema.v1.json}
  contract://P0/authorized_paths/P6/fresh_test_roots: {owner: P0, resolver: authorized_paths.P6.fresh_test_roots, schema_ref: contracts/baseline_contract.schema.v1.json}
  contract://P0/authorized_paths/P6/rt7_reconciliation: {owner: P0, resolver: authorized_paths.P6.rt7_reconciliation, schema_ref: contracts/baseline_contract.schema.v1.json}
state_schema:
  schema_ref: contracts/runtime_state.schema.v1.json
  required_fields:
    - graph_version
    - graph_digest
    - run_id
    - node_id
    - node_attempt
    - prompt_digest
    - policy_digest
    - schema_digest
    - route_digest
    - execution_contract_digest
    - phase_key
    - phase_ledger_hash
    - active_continuation_hash
    - consumed_continuation_ids
    - authorized_input_hashes
    - authorized_output_schema
    - route_decision
    - receipt_hash
    - check_results
    - edge_decision
    - checkpoint_hash
  unit_terminal_states: [ACCEPTED, BLOCKED, SYSTEM_FAILURE]
  run_pause_states: [INTERRUPTED]
  plan_pause_states: [PAUSED_PREREQUISITE, INTERRUPTED]
  plan_terminal_states: [PLAN_APPROVED, SYSTEM_FAILURE]
  failure_classes:
    - TRANSIENT_TOOL_FAILURE
    - INVALID_MODEL_OUTPUT
    - POLICY_VIOLATION
    - CHECK_FAILED_REVISABLE
    - EXTERNAL_FACT_BLOCK
    - FACTORY_DEFECT
    - CONVERGENCE_EXHAUSTED
    - AUTHENTICATION_MISSING
    - SUBSCRIPTION_ENTITLEMENT_UNPROVEN
    - PROTECTED_DIRTY_OVERLAP
    - INTERRUPTED_EXTERNAL
state_fields:
  P0_contract_bundle:
    schema_ref: contracts/p0_contract_bundle.schema.v1.json
    writers: [P0]
    readers: [P1, P2, P4, P5, P6]
    reducer: replace_once
    serialization: canonical_yaml
    checkpoint_policy: immutable
  P1_compiler_bundle:
    schema_ref: artifact://P1/schemas/prompt_graph.schema.v1.json
    writers: [P1]
    readers: [P2, P3, P4, P6]
    reducer: replace_once
    serialization: canonical_json
    checkpoint_policy: immutable
  P2_adapter_bundle:
    schema_ref: artifact://P2/schemas/worker_receipt.schema.v1.json
    writers: [P2]
    readers: [P3, P4, P6]
    reducer: replace_once
    serialization: canonical_json
    checkpoint_policy: immutable
  P3_runtime_contract:
    schema_ref: artifact://P3/schemas/runtime_contract.schema.v1.json
    writers: [P3]
    readers: [P4, P6]
    reducer: replace_once
    serialization: canonical_yaml
    checkpoint_policy: immutable
  P4_migration_bundle:
    schema_ref: contracts/artifact_bundle.schema.v1.json
    writers: [P4]
    readers: [P5, P6]
    reducer: replace_once
    serialization: canonical_json
    checkpoint_policy: immutable
  P5_evaluation_bundle:
    schema_ref: contracts/artifact_bundle.schema.v1.json
    writers: [P5]
    readers: [P6]
    reducer: replace_once
    serialization: canonical_json
    checkpoint_policy: immutable
  P6_release_bundle:
    schema_ref: contracts/artifact_bundle.schema.v1.json
    writers: [P6]
    readers: []
    reducer: replace_once
    serialization: canonical_json
    checkpoint_policy: immutable
