graph_invariants:
  - The shipped bootstrap validator must pass before P0; after P1, the production compiler must self-compile this same manifest before P2.
  - Every node is reachable from START and can reach PLAN_APPROVED or SYSTEM_FAILURE; pauses and interrupts are resumable states with typed return edges.
  - Every phase is sequentially activated from a digest-bound predecessor; model-bearing evaluation fan-out occurs inside compiled production graphs, not through shared meta-plan writes.
  - Every model-bearing node uses the normalized subscription worker request and receipt contract.
  - PHASE_CONTROLLER alone admits phase events; PASS requires exact compiled test and artifact denominators, all tests passing with evidence, recomputed hashes, and current run/digest/checkpoint binding.
  - Every pause or interrupt creates one controller-owned continuation; a single-use authorized command may resume only the same run and suspended node under unchanged digests.
  - No curriculum acceptance path bypasses deterministic checks and an independent cross-family judge.
  - Every repair cycle is first-class, bounded, and has a SYSTEM_FAILURE exhaustion disposition; BLOCKED is never a plan-phase target.
  - Checkpoints distinguish replayable ABSENT or crash-INCOMPLETE state from fail-closed HASH_MISMATCH, CORRUPT, or UNAUTHORIZED_MUTATION.
  - Unit BLOCKED is reserved for a named unavailable external safety-critical fact; factory defects become SYSTEM_FAILURE.
  - Every check and artifact has one owning production node and one repair edge or non-revisable terminal edge.
  - Historical evidence and accepted artifacts are immutable and excluded from write scopes.
  - Every phase uses a compiled phase-level idempotency key and immutable ledger whose domain-separated subtasks replay only ABSENT or INCOMPLETE work.
