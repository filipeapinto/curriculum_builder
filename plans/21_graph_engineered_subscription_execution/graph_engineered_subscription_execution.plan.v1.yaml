nodes:
  - id: P0
    prompt: prompts/P0_contract_and_evidence_freeze.prompt.v1.md
    role: deterministic
    owner: contract_freezer
    goal: Freeze the live repository, prior findings, subscription constraint, Plan 19 conflicts, and exact execution contract before implementation.
    depends_on: []
    authorized_inputs:
      - graph_engineered_subscription_execution.plan.v1.yaml
      - graph_engineered_subscription_execution.schema.v1.json
      - contract://anti_regression_sources
      - repository://read-only
    authorized_outputs:
      - plans/21_graph_engineered_subscription_execution/results/P0.result.v1.md
      - plans/21_graph_engineered_subscription_execution/contracts/baseline_contract.v1.yaml
      - plans/21_graph_engineered_subscription_execution/contracts/historical_findings.v1.yaml
      - plans/21_graph_engineered_subscription_execution/contracts/coverage_denominator.v1.yaml
      - plans/21_graph_engineered_subscription_execution/tools/historical_census.py
      - plans/21_graph_engineered_subscription_execution/tools/test_historical_census.py
      - plans/21_graph_engineered_subscription_execution/results/ledgers/P0.attempt-{attempt}.ledger.v1.yaml
    input_schemas: [graph_engineered_subscription_execution.schema.v1.json]
    output_schemas:
      - contracts/baseline_contract.schema.v1.json
      - contracts/historical_findings.schema.v1.json
      - contracts/coverage_denominator.schema.v1.json
      - contracts/phase_ledger.schema.v1.json
    context_from: []
    state_reads: []
    state_writes: [P0_contract_bundle]
    side_effect_class: workspace_write
    idempotency:
      phase_key_template: "{execution_contract_digest}:P0:{phase_attempt}"
      subtask_key_template: "{phase_key}:{subtask_id}:{input_digest}"
      ledger_schema: contracts/phase_ledger.schema.v1.json
      activation_fields: [execution_contract_digest, phase_attempt, subtask_id, input_digest]
      replay_policy: resume_absent_or_incomplete_never_repeat_committed
    required_test_ids: [P0-T00, P0-T01, P0-T02, P0-T03, P0-T04, P0-T05, P0-T06, P0-T07, P0-T08, P0-T09, P0-T10, P0-T11]
    tests: [P0-T00 through P0-T11 in the P0 prompt]
    loop: Repair only the inventory or contract record named by a failing test, then rerun all P0 tests because every later node binds this digest.
    stop_conditions:
      - Stop to SYSTEM_FAILURE if protected user work cannot be distinguished from Plan 21 outputs.
      - Stop to SYSTEM_FAILURE if Plan 19 and Plan 20 conflicts cannot be enumerated without inventing unrecorded intent.
  - id: P1
    prompt: prompts/P1_graph_ir_and_static_compiler.prompt.v1.md
    role: mixed
    owner: graph_compiler
    goal: Implement a versioned graph IR and production compiler that rejects structurally unsafe prompt workflows and emits witness paths.
    depends_on: [P0]
    authorized_inputs:
      - state://P0_contract_bundle
      - graph_engineered_subscription_execution.plan.v1.yaml
      - graph_engineered_subscription_execution.schema.v1.json
    authorized_outputs:
      - runtime/prompt_graph.py
      - schemas/prompt_graph.schema.v1.json
      - tests/runtime/test_prompt_graph.py
      - plans/21_graph_engineered_subscription_execution/results/P1.result.v1.md
      - plans/21_graph_engineered_subscription_execution/results/P1.compiled_graph.v1.json
      - plans/21_graph_engineered_subscription_execution/results/ledgers/P1.attempt-{attempt}.ledger.v1.yaml
    input_schemas: [contracts/baseline_contract.schema.v1.json, graph_engineered_subscription_execution.schema.v1.json]
    output_schemas: [artifact://P1/schemas/prompt_graph.schema.v1.json, contracts/phase_ledger.schema.v1.json]
    context_from: [P0]
    state_reads: [P0_contract_bundle]
    state_writes: [P1_compiler_bundle]
    side_effect_class: workspace_write
    idempotency:
      phase_key_template: "{execution_contract_digest}:P1:{phase_attempt}"
      subtask_key_template: "{phase_key}:{subtask_id}:{input_digest}"
