  migration_owner: P4
new_invariants:
  - A digest is evidence only after the controller reads an existing regular source file inside a resolved authorized root and recomputes SHA-256 from its bytes.
  - Required test, artifact, and phase-subtask denominators come from the compiled node contract and can never be declared by the event, manifest, or ledger being admitted.
  - Resume authorization is created by an external operator authority before activation and is atomically consumed in durable state before the suspended node can run.
  - Every registry schema path and resolver is validated even when no node currently references the entry; unused or unresolvable entries are compile errors.
  - Sandbox assurance binds executable profile bytes, engine bytes, OS ownership and mode, resolved roots, and executed escape-probe evidence; hash-shaped claims alone fail.
review_protocol:
  independent_reviewers: 3
  roles: [graph_formalism_and_runtime, historical_regression_and_repository, prompt_execution_and_subscription_security]
  exit_rule: Version 2 is approved only when all three new-version reviews independently report zero unresolved Critical and High findings on identical frozen bytes.
  iteration_rule: Any version-2 Critical or High finding creates version 3; reviewers never repair the version they assess.
