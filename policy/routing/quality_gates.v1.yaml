version: 1

# The contract this manifest is validated against. FR-P4-ALL-VALIDATE resolves the
# pairing from this pointer rather than from a list held in the gate, so a new
# manifest cannot be added without one.
schema: schemas/quality_gates.schema.v1.json

gates:
  electronics:
    requires: [circuit_data_valid, component_orientation_checked, supply_limit_checked, hazard_checked, meter_setup_checked]
    fail_action: revise_circuit_or_adult_guide
  pedagogy:
    requires: [component_oriented, purpose_before_mechanism, substantive_explanation, child_adult_roles_separated, evidence_activity]
    fail_action: revise_child_lab
  visual:
    requires: [photorealistic_supporting_visuals, deterministic_map, print_legibility, image_text_alignment, no_generated_text_as_authority]
    fail_action: revise_visual_plan_or_assets
  release:
    requires: [electronics_pass, pedagogy_pass, visual_pass]
    conditional_requirement: physical_kit_signoff_for_powered_release
    fail_action: do_not_start_next_lab
