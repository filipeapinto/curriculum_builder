    owner: policy/failures.v1.yaml
    method: execution
    deferred: RT-5
    asserts: >-
      ACT and EXEC ids increase monotonically by construction, never recovered by
      counting text in the file being written
    stage: logger
    note: corrects B1
  - id: LOG-PAIRED
    owner: schemas/execution_log.schema.v2.json
    method: execution
    deferred: RT-5
    asserts: >-
      every started ACT is closed exactly once, by a completion ACT citing its id or an
      EXEC whose mandatory Closes field cites it; the unclosed set is empty
    stage: logger
  - id: LOG-CONCURRENT-SAFE
    owner: policy/failures.v1.yaml
    method: execution
    deferred: RT-5
    asserts: concurrent appends do not clobber earlier records
    stage: logger
  - id: LOG-COVERAGE
    owner: policy/controller.v1.yaml
    method: execution
    deferred: RT-5
    asserts: every checkpoint and state transition has an action record
    stage: logger
  - id: LOG-NO-ORPHAN-OPERATION
    owner: policy/controller.v1.yaml
    method: execution
    deferred: RT-5
    asserts: an operation without its action record fails the run
    stage: logger

# ---------------------------------------------------------------------------
reviewers:
  - id: REV-COUNT-TWELVE
    owner: meta_prompt/assets/architecture.v1.md
    method: execution
    deferred: RT-5
    asserts: exactly twelve reviewer invocations per lab — 4 plan, 4 QA, 4 PDF
    stage: golden
  - id: REV-ISOLATED
    owner: policy/failures.v1.yaml
    method: execution
    deferred: RT-5
    asserts: >-
      no reviewer's authorized input set can reach any sibling reviewer's output. The
      test fails if a path exists
    stage: deterministic
    note: corrects B2 — structural isolation, not instructed isolation

# ---------------------------------------------------------------------------
# Model selection. Deliberately not ROUTE-*: "route" already means an external
# capability proven by preflight, and these are about which model serves which
# task. Each id names the file that states the rule and the method that verifies
# it. An id whose method is `execution` needs a runtime nobody has built yet; it
# carries the deferred id that would discharge it and is recorded
# MAPPED, NOT EXECUTED — never as covered.
selector:
  - id: SEL-DECISION-VALID
    asserts: >-
      every routing decision validates against
      schemas/routing_decision.schema.v2.json with all ten required fields, and its
      decided_model is a member of policy/routing/model_registry.v1.yaml
    stage: static
    owner: meta_prompt/assets/routing.v1.md
    method: schema
    artifact: schemas/routing_decision.schema.v2.json
    verified_by: FR-P2-DECISION-VALID
  - id: SEL-NO-MODEL-BYPASS
    asserts: >-
      --model is a fallback only and may not bypass the selector in
      policy/routing/; a record whose executed_model differs from its
      decided_model is a violation
    stage: static
    owner: policy/controller.v1.yaml
    method: declaration
    artifact: schemas/routing_decision.schema.v2.json
    verified_by: FR-P2-BYPASS-DECLARED
    note: >-
      stated, representable and compared in gate code. Refusing the call at runtime
      is RT-3; nothing executes --model today.
  - id: SEL-NO-MODEL-FOR-DETERMINISTIC
    asserts: >-
      no model is used for merge, validation, hashing, rendering, aggregation,
      audits or the logger
    stage: static
    owner: policy/controller.v1.yaml
    method: execution
    deferred: RT-5
  - id: SEL-ESCALATION-BOUNDED
    asserts: >-
      maximum reasoning effort is reached only through a failed safety escalation,
      and escalation stops at the convergence limits in policy/limits.v1.yaml
    stage: static
    owner: policy/routing/routing_policy.v1.yaml
    method: execution
    deferred: RT-5
  - id: SEL-EXECUTED-MATCHES-DECIDED
    asserts: >-
      the model a call actually ran on equals the model its routing decision
      decided on
    stage: static
    owner: meta_prompt/assets/routing.v1.md
    method: execution
    deferred: RT-3

# ---------------------------------------------------------------------------
drift:
  - id: DRIFT-SCOPE
    owner: meta_prompt/meta_curriculum_builder.prompt.v6.md
    method: execution
    deferred: RT-5
    asserts: no write left the authorized roots and no immutable file changed
  - id: DRIFT-NO-EARLY-GENERATION
    owner: meta_prompt/meta_curriculum_builder.prompt.v6.md
    method: execution
    deferred: RT-5
    asserts: no live dossier was created for any lab beyond L01 during the meta run
  - id: DRIFT-NO-WEAKENING
    owner: meta_prompt/assets/logging.v1.md
    method: execution
    deferred: RT-5
    asserts: no test, schema, evidence rule or release gate was weakened to obtain a pass
  - id: DRIFT-NO-MISREPORTING
    owner: policy/failures.v1.yaml
    method: execution
    deferred: RT-5
    asserts: >-
      static and simulated coverage was never described as generated-lab coverage, and
      no check was reported as present without executing
  - id: DRIFT-TRACEABLE
    owner: policy/controller.v1.yaml
    method: execution
    deferred: RT-5
    asserts: every action links to an authorized deliverable, a failed gate, a resource total or a terminal decision
  - id: DRIFT-CONVERGING
    owner: policy/limits.v1.yaml
    method: execution
    deferred: RT-5
    asserts: >-
      the same failed-check set did not repeat twice without narrowing, and two cycles
      did not add complexity without reducing failed gates
  - id: DRIFT-EVIDENCE-STABLE
    owner: policy/controller.v1.yaml
    method: execution
    deferred: RT-5
    asserts: no accepted evidence changed without reopening its gate

# ---------------------------------------------------------------------------
preconditions:
  - id: PRECONDITION-OUTPUT-ROOT-EXISTS
    owner: meta_prompt/meta_curriculum_builder.prompt.v6.md
    method: execution
    deferred: RT-5
    asserts: V7 does not exist at startup
    on_failure: >-
      stop immediately as META_SYSTEM_FAILURE before any artifact or model call.
      Report the occupied path and the next free version name. Never auto-increment,
      never merge, never overwrite — choosing which evidence to keep is a human
      decision an unattended run must not make.
  - id: PRECONDITION-ASSETS-RESOLVE
    owner: meta_prompt/meta_curriculum_builder.prompt.v6.md
    method: execution
    deferred: RT-5
    asserts: >-
      every row of the meta prompt's asset table resolves, every asset it declares a
      section carries the banner naming this prompt, every companion carries none, and
      every heading a banner claims is stated in the file claiming it
    on_failure: >-
      stop as META_SYSTEM_FAILURE before any artifact or model call. The contract read
      is not the contract written: a section that has left the composition takes its
      rules with it, and an unattended run cannot tell a shorter contract from a
      satisfied one.
  - id: ROUTE-PROVEN
    owner: policy/routes.v1.yaml
    method: execution
    deferred: RT-2
    asserts: every route in policy/routes.v1.yaml made one real preflight call
    stage: live-capability
