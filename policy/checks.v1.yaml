# The engine's check inventory — every stable check id that binds every run regardless
# of curriculum, what it asserts, and where it is enforced.
#
# A check named in a result record but never executed is evidence misreporting —
# that is gate B3, and it is a drift stop, not a bug. So the inventory is exhaustive,
# and a meta-test asserts that every id advertised by a result appears in it with a
# real assertion behind it.
#
# **The inventory is two kinds of file, and this is the engine's.** A check whose
# subject is one curriculum's file lives with that curriculum, in
# curricula/<name>/checks.v1.yaml, validated against this same contract. Until
# plans/simplification/plan/simplification.plan.v3.md section 6 phase 3 they were all
# here, and that is G3: not only that domain checks shared the engine's id namespace,
# but that the engine's inventory held the *paths* of one curriculum's files as the
# subjects of its checks. FR-P4-CHECK-MAPPING reads both halves as one inventory, so
# nothing was dropped rather than moved.
#
# Being listed here is not being executed, and the two are never conflated. Every id
# names the file that states its rule and the method that verifies it, and resolves
# either to a gate that runs it — recorded VERIFIED HERE — or to the deferred
# obligation that would, recorded MAPPED, NOT EXECUTED with its RT- id. Most ids are
# the second kind today: no controller, logger, renderer or live route exists.

checks_version: '1.0'

# The contract this manifest is validated against. FR-P4-ALL-VALIDATE resolves the
# pairing from this pointer rather than from a list held in the gate, so a new
# manifest cannot be added without one.
schema: schemas/checks.schema.v1.json


calibration:
- id: CAL-VALID
  owner: policy/calibration.v1.yaml
  method: schema
  artifact: schemas/calibration.schema.v1.json
  verified_by: FR-P0-SCHEMA
  asserts: policy/calibration.v1.yaml validates against schemas/calibration.schema.v1.json
  stage: static
  note: run first — every later check reads values from calibration
- id: CAL-SCHEMA-AGREE
  owner: policy/calibration.v1.yaml
  method: mapping
  artifact: schemas/lab.schema.v4.json
  verified_by: FR-P3-CAL-AGREE
  asserts: every value in calibration.pedagogy_caps equals the schema constraint named in that cap's
    own enforced_by pointer
  stage: static
  note: a schema cap that drifts from its premise fails the build
curriculum:
- id: CUR-COUNT-DERIVED
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: the lab count used by every test and command was read from the manifest at run time, and
    no fixed count appears in code, schema, CLI default or report text
  stage: static
- id: CUR-BOUNDED-PROMPTS
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: every worker prompt declares role, check ids, authorized paths and one output schema
  stage: static
lab_document:
- id: LAB-SCHEMA-VALID
  owner: schemas/lab.schema.v4.json
  method: execution
  artifact: schemas/lab.schema.v4.json
  deferred: RT-5
  asserts: the unit validates against schemas/lab.schema.v4.json — the six engine blocks and the domain
    block — and its domain block validates against the schema its own curriculum names in manifest domain.schema
  stage: golden
  note: 'already executes in production, at runtime/session_bridge.py''s finalize(), which
    validates the unit against inputs/lab.schema.json and its domain block against
    inputs/domain.schema.json before anything is rendered, recording the result in
    results/unit_checks.json. deferred RT-5 stays because no registered gate in
    tests/gates/registry.py verifies that call site — whether RT-5''s obligation is still
    outstanding and whether a gate checks that this entry is honest are different questions, and
    only the second is what verified_by answers.'
- id: LAB-BLOOM-DEPTH
  owner: schemas/lab.schema.v4.json
  method: execution
  artifact: schemas/lab.schema.v4.json
  deferred: RT-5
  asserts: at least one learning objective reaches the Bloom level floored by calibration.pedagogy_caps.bloom_floor.
    The floor is a premise and is never restated here; this check asserts the lab meets it.
  stage: deterministic
  fixture_expectation: reject
  rejects: a lab whose objectives sit entirely at the lowest Bloom level — identification alone is not
    a lab
- id: LAB-POE-ORDER
  owner: schemas/lab.schema.v4.json
  method: execution
  artifact: schemas/lab.schema.v4.json
  deferred: RT-5
  asserts: the prediction is recorded before the observation
  stage: deterministic
  fixture_expectation: reject
  rejects: recorded_before_observing false or absent
unit:
- id: TEXT-READABILITY-BAND
  owner: policy/calibration.v1.yaml
  method: mapping
  artifact: schemas/calibration.schema.v1.json
  verified_by: FR-P5-READABILITY
  asserts: 'every unit''s child-facing text scores inside the band policy/calibration.v1.yaml declares
    under readability, by the metric that block names. A band and not a ceiling: text far below it is
    as wrong as text far above it.'
  stage: deterministic
  fixture: tests/fixtures/unit_readability_above_band.reject.json
  fixture_expectation: reject
  note: 'the check now executes against real rendered child-facing text, at
    runtime/checks.py::readability_problems over the markdown runtime/lesson_render.py produces
    for each unit under outputs/<run>/L0N/, sharing one implementation with the fixture gate
    through runtime/readability.py. RT-7 remains unmet all the same — its acceptance criterion
    names units under curricula/<name>/units/, that directory is still empty, and nothing here
    discharges it.'
- id: TEXT-BLOOM-VERBS
  owner: policy/calibration.v1.yaml
  method: mapping
  artifact: schemas/calibration.schema.v1.json
  verified_by: FR-P5-BLOOM-VERBS
  asserts: every disagreement between an objective's declared bloom_level and the verb that opens its
    statement is raised and recorded against the ordered bloom_verbs table. This check FLAGS and NEVER
    BLOCKS — human raters agree with each other on Bloom level only 46.58% of the time, so what is asserted
    is that the disagreement was reported, never that the verdict is right.
  stage: deterministic
  fixture: tests/fixtures/unit_bloom_verb_below_level.reject.json
  fixture_expectation: reject
  note: LAB-BLOOM-DEPTH checks the declared field against the floor; this reads the sentence beneath
    it. Two different questions, and neither answers the other.
- id: DOC-DERIVED-FROM-SOURCE
  owner: policy/failures.v1.yaml
  method: mapping
  artifact: tests/fixtures/unit_derivation_one_parent.accept.json
  verified_by: FR-P5-DERIVATION
  asserts: 'every fact a unit renders names the pointer into its own domain block that it came from,
    that pointer resolves, and the rendered string equals what is there. A unit that renders no fact
    from its domain data fails: prose with no parent is the defect, not the absence of a check.'
  stage: deterministic
  fixture: tests/fixtures/unit_derivation_unparented.reject.json
  fixture_expectation: reject
  note: corrects A6 and A8 — one parent, checked mechanically rather than asserted
- id: RECEIPT-HASH-RESOLVES
  owner: policy/failures.v1.yaml
  method: mapping
  artifact: tests/fixtures/unit_receipt_resolves.accept/unit.json
  verified_by: FR-P5-RECEIPT-HASH
  asserts: every visual's recorded provenance hash equals the SHA-256 recomputed from the bytes of the
    artifact it names. The hash is recomputed and never trusted as recorded.
  stage: deterministic
  fixture: tests/fixtures/unit_receipt_unresolved.reject/unit.json
  fixture_expectation: reject
  note: B4 generalised out of PDFs. PDF-ASSET-RESOLVES is the same rule against a rendered artifact
    and needs a renderer; this one needs only bytes, so it runs today.
pdf:
- id: PDF-PAGE-COUNT
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: rendered page count equals the count recorded at assembly
  stage: golden
  note: 'already executes in production, at runtime/session_bridge.py''s finalize(), via
    runtime/checks.py::pdf_page_count against the shipped PDF, with the count recorded in
    acceptance.json. deferred RT-5 stays because no registered gate verifies that call site.'
- id: PDF-PAGE-NONBLANK
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: no page is uniform within 1% of a single colour
  stage: golden
  rejects: blank or all-black pages
  note: 'already executes in production, at runtime/session_bridge.py''s finalize(), via
    runtime/checks.py::rasterize_and_check_nonblank over every rasterized page at 200 dpi.
    deferred RT-5 stays because no registered gate verifies that call site.'
- id: PDF-ASSET-RESOLVES
  owner: policy/failures.v1.yaml
  method: execution
  deferred: RT-5
  asserts: every visual receipt's recorded hash matches an asset actually embedded in this PDF
  stage: golden
  note: 'corrects B4 — a receipt that does not resolve is a failed gate, not a warning. Now
    executes in production at runtime/pdf_inspect.py::assets_resolve, called from
    runtime/session_bridge.py''s finalize() and exercised by
    tests/runtime/test_acceptance_gate.py. A raster asset is re-encoded when it is placed, so what
    is checked is that the receipt resolves against the bytes on disk and that a perceptually
    equal image is embedded in the shipped PDF. deferred RT-5 stays because no registered gate
    verifies that call site.'
- id: PDF-TEXT-LEGIBLE
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: body text renders at 9 pt or above effective at 200 dpi and is not clipped
  stage: golden
  note: 'now executes in production at runtime/pdf_inspect.py::text_legible, called from
    runtime/session_bridge.py''s finalize() and exercised by
    tests/runtime/test_acceptance_gate.py, reading every rendered line''s box with pdftotext
    -bbox-layout. deferred RT-5 stays because no registered gate verifies that call site.'
- id: PDF-VISUAL-REVIEW
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: all four PDF reviewers pass against the rasterized pages
  stage: golden
  note: 'now executes in production as a recording-and-blocking rule rather than as automated
    computer vision, at runtime/pdf_inspect.py::visual_review_template and visual_review_problems,
    called from runtime/session_bridge.py''s finalize() and exercised by
    tests/runtime/test_acceptance_gate.py. An absent or unfilled structured verdict blocks
    ACCEPTED and never passes by default. deferred RT-5 stays because no registered gate verifies
    that call site.'
log:
- id: LOG-APPEND-ONLY
  owner: schemas/execution_log.schema.v2.json
  method: execution
  deferred: RT-5
  asserts: no record is rewritten, reordered or deleted once on disk
  stage: logger
- id: LOG-IDS-MONOTONIC
  owner: policy/failures.v1.yaml
  method: execution
  deferred: RT-5
  asserts: ACT and EXEC ids increase monotonically by construction, never recovered by counting text
    in the file being written
  stage: logger
  note: corrects B1
- id: LOG-PAIRED
  owner: schemas/execution_log.schema.v2.json
  method: execution
  deferred: RT-5
  asserts: every started ACT is closed exactly once, by a completion ACT citing its id or an EXEC whose
    mandatory Closes field cites it; the unclosed set is empty
  stage: logger
- id: LOG-CONCURRENT-SAFE
  owner: policy/failures.v1.yaml
  method: execution
  deferred: RT-5
  asserts: concurrent appends do not clobber earlier records
  stage: logger
- id: LOG-COVERAGE
  owner: policy/controller.v1.yaml
  method: execution
  deferred: RT-5
  asserts: every checkpoint and state transition has an action record
  stage: logger
- id: LOG-NO-ORPHAN-OPERATION
  owner: policy/controller.v1.yaml
  method: execution
  deferred: RT-5
  asserts: an operation without its action record fails the run
  stage: logger
reviewers:
- id: REV-JUDGE-SINGLE-CROSS-FAMILY
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: exactly one judge invocation per pass, from a different model family than the generator,
    with an explicit rubric and a randomised presentation order, and its verdict recorded with both
  stage: golden
  note: >-
    replaces REV-COUNT-TWELVE, retired by section 6 phase 5 of the simplification plan. Nine
    cross-family judges provide 2.18 effective votes and the best single judge matched the full
    panel, so twelve invocations bought roughly two independent opinions at twelve times the cost.
    The recovered budget goes to deterministic checks, which beat judges by 1.2x to 7x where both
    were measured. Self-preference bias is -38% to +90% and survives hiding authorship, which is
    why the family must differ rather than merely the instance.
- id: REV-ISOLATED
  owner: policy/failures.v1.yaml
  method: execution
  deferred: RT-5
  asserts: no reviewer's authorized input set can reach any sibling reviewer's output. The test fails
    if a path exists
  stage: deterministic
  note: corrects B2 — structural isolation, not instructed isolation
selector:
- id: SEL-DECISION-VALID
  asserts: every routing decision validates against schemas/routing_decision.schema.v2.json with all
    ten required fields, and its decided_model is a member of policy/routing/model_registry.v1.yaml
  stage: static
  owner: meta_prompt/curriculum.prompt.v1.md
  method: schema
  artifact: schemas/routing_decision.schema.v2.json
  verified_by: FR-P2-DECISION-VALID
- id: SEL-NO-MODEL-BYPASS
  asserts: --model is a fallback only and may not bypass the selector in policy/routing/; a record whose
    executed_model differs from its decided_model is a violation
  stage: static
  owner: policy/controller.v1.yaml
  method: declaration
  artifact: schemas/routing_decision.schema.v2.json
  verified_by: FR-P2-BYPASS-DECLARED
  note: stated, representable and compared in gate code. Refusing the call at runtime is RT-3; nothing
    executes --model today.
- id: SEL-NO-MODEL-FOR-DETERMINISTIC
  asserts: no model is used for merge, validation, hashing, rendering, aggregation, audits or the logger
  stage: static
  owner: policy/controller.v1.yaml
  method: execution
  deferred: RT-5
- id: SEL-ESCALATION-BOUNDED
  asserts: maximum reasoning effort is reached only through a failed safety escalation, and escalation
    stops at the convergence limits in policy/limits.v1.yaml
  stage: static
  owner: policy/routing/routing_policy.v1.yaml
  method: execution
  deferred: RT-5
- id: SEL-EXECUTED-MATCHES-DECIDED
  asserts: the model a call actually ran on equals the model its routing decision decided on
  stage: static
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-3
drift:
- id: DRIFT-SCOPE
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: no write left the authorized roots and no immutable file changed
- id: DRIFT-NO-EARLY-GENERATION
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: no live dossier was created for any lab beyond L01 during the meta run
- id: DRIFT-NO-WEAKENING
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: no test, schema, evidence rule or release gate was weakened to obtain a pass
- id: DRIFT-NO-MISREPORTING
  owner: policy/failures.v1.yaml
  method: execution
  deferred: RT-5
  asserts: static and simulated coverage was never described as generated-lab coverage, and no check
    was reported as present without executing
- id: DRIFT-TRACEABLE
  owner: policy/controller.v1.yaml
  method: execution
  deferred: RT-5
  asserts: every action links to an authorized deliverable, a failed gate, a resource total or a terminal
    decision
- id: DRIFT-CONVERGING
  owner: policy/limits.v1.yaml
  method: execution
  deferred: RT-5
  asserts: the same failed-check set did not repeat twice without narrowing, and two cycles did not
    add complexity without reducing failed gates
- id: DRIFT-EVIDENCE-STABLE
  owner: policy/controller.v1.yaml
  method: execution
  deferred: RT-5
  asserts: no accepted evidence changed without reopening its gate
preconditions:
- id: PRECONDITION-OUTPUT-ROOT-EXISTS
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: V7 does not exist at startup
  on_failure: stop immediately as META_SYSTEM_FAILURE before any artifact or model call. Report the
    occupied path and the next free version name. Never auto-increment, never merge, never overwrite
    — choosing which evidence to keep is a human decision an unattended run must not make.
- id: PRECONDITION-ASSETS-RESOLVE
  owner: meta_prompt/curriculum.prompt.v1.md
  method: execution
  deferred: RT-5
  asserts: every row of the meta prompt's asset table resolves, every asset it declares a section carries
    the banner naming this prompt, every companion carries none, and every heading a banner claims is
    stated in the file claiming it
  on_failure: 'stop as META_SYSTEM_FAILURE before any artifact or model call. The contract read is not
    the contract written: a section that has left the composition takes its rules with it, and an unattended
    run cannot tell a shorter contract from a satisfied one.'
- id: ROUTE-PROVEN
  owner: policy/routes.v1.yaml
  method: execution
  deferred: RT-2
  asserts: every route in policy/routes.v1.yaml made one real preflight call
  stage: live-capability
