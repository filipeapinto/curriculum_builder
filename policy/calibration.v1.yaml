# Calibration — the premises every other rule derives from.
#
# The pedagogy caps in schemas/lab.schema.v3.json are not universal truths. They are
# what follows from the learner this file describes. This file states that premise
# once so nothing downstream has to guess it, and so no document can quietly assume
# a different one.
#
# Precedence: this file outranks every prose document in the project. Where
# curricula/arduino_kit/lab_brief.md, curricula/arduino_kit/teacher_framework.md,
# curricula/arduino_kit/teacher_audit.md or curricula/arduino_kit/roster.md state a
# learner age, a supply, or a supervision rule that differs from the values below,
# this file wins and the difference is a defect to be reported, not resolved silently.
#
# What is NOT here: the permitted supplies. They belong to one kit, not to the
# engine, and they moved to curricula/arduino_kit/kit_calibration.v1.yaml in phase 3
# of the folder-refactoring plan. policy/ binds every run regardless of curriculum;
# a second curriculum would otherwise have inherited one kit's supplies in silence.

calibration_version: '1.0'

# The contract this manifest is validated against. FR-P4-ALL-VALIDATE resolves the
# pairing from this pointer rather than from a list held in the gate, so a new
# manifest cannot be added without one.
schema: schemas/calibration.schema.v1.json


learner:
  age_band: '9+'
  description: Supervised beginners aged nine and above, with no assumed electronics knowledge.
  supervision: adult_required
  reading: one idea per short paragraph; a new word is defined beside its first useful visual

# Derived from learner.age_band. Change the age band and these must be re-derived
# and justified — never edited independently of it.
#
# Each cap states three things, and a cap missing any of them is a failure rather
# than a skip:
#   value          the premise itself
#   enforced_by    the exact schema constraint that carries it, which
#                  FR-P3-CAL-AGREE follows and compares against the value
#   prose_pattern  an anchored regular expression matching the cap *as it would be
#                  written in prose*. FR-P3-CAPS-OWNED matches that pattern, never
#                  the bare value: a cap whose value is 1, 2, `required` or
#                  `understand` would otherwise flag every ordinal, list index and
#                  ordinary sentence in the repository. This block is where the cap
#                  is owned, so it is the one place the pattern is allowed to match.
pedagogy_caps:
  new_terms_per_lab:
    value: 2
    enforced_by: schemas/lab.schema.v3.json → pedagogy.vocabulary.maxItems
    prose_pattern: '(?i)\b(?:no more than|at most|capped at|maximum of|limit of)\s+(?:two|2)\s+new\s+(?:terms?|words?|vocabulary)\b'
    rationale: cognitive load — the working-memory limit at this age band
  segments_per_lab:
    value: [2, 6]
    enforced_by: schemas/lab.schema.v3.json → pedagogy.cognitive_load.segments
    prose_pattern: '(?i)\b(?:no more than|at most|capped at|maximum of|limit of)\s+(?:six|6)\s+(?:segments?|chunks?)\b'
    rationale: segmenting — more than six chunks overloads
  bloom_floor:
    value: understand
    enforced_by: schemas/lab.schema.v3.json → pedagogy.learning_objectives.contains.bloom_level.enum
    prose_pattern: '(?i)\b(?:one|at least one)\s+(?:learning\s+)?objective\s+(?:must\s+)?(?:reach|reaches|be|sit at)\s+["\x27`]?understand\b'
    rationale: at least one objective above recall
  objectives_per_lab:
    value: [1, 3]
    enforced_by: schemas/lab.schema.v3.json → pedagogy.learning_objectives
    prose_pattern: '(?i)\b(?:between\s+)?(?:one|1)\s+(?:to|and|-)\s+(?:three|3)\s+(?:learning\s+)?objectives\b'
    rationale: enough to structure a lab, few enough to assess
  success_criterion_voice:
    value: first_person
    enforced_by: schemas/lab.schema.v3.json → pedagogy.learning_objectives.items.success_criterion.pattern
    prose_pattern: '(?i)\bsuccess\s+criteri(?:on|a)\b[^.\n]{0,40}?(?:first[- ]person|I can\b)'
    rationale: '"I can ..." — the child must be able to judge their own work'
  misconceptions_per_lab_min:
    value: 1
    enforced_by: schemas/lab.schema.v3.json → pedagogy.misconceptions.minItems
    prose_pattern: '(?i)\b(?:requires|at least|no fewer than|minimum of)\s+(?:one|1)\s+misconception\b'
    rationale: conceptual change — an untouched misconception survives a good explanation
  concrete_before_abstract:
    value: required
    enforced_by: schemas/lab.schema.v3.json → pedagogy.cognitive_load.required
    prose_pattern: '(?i)\bconcrete[- ]before[- ]abstract\s+is\s+(?:required|mandatory)\b'
    rationale: the physical object and action come before any schematic symbol

# Applies to the whole workbook regardless of age band.
safety_floor:
  power_off_before_rewiring: required
  troubleshooting_starts_power_off: required
  adult_guide_separate_from_child_text: required
  stop_if_warm: required

# Every fact in this file that describes *this learner* rather than any learner,
# and the anchored pattern that matches it as it would be written in prose.
#
# FR-P3-NO-LITERALS matches the pattern and never the bare value: an age of `9`
# scanned literally would flag every `9` in every schema, including `"maxItems": 9`.
# A contract that hard-codes the learner cannot serve a different one — that is
# defect F03, and lab.schema.v3.json carried it in two descriptions.
learner_terms:
  nine-year-old:
    kind: learner_age_prose
    prose_pattern: '(?i)\bnine[- ]year[- ]olds?\b'
  '9+':
    kind: learner_age_band
    prose_pattern: '(?i)\b(?:age[d_ -]?band|aged)\s*["\x27`]?9\+'
  '9':
    kind: learner_age
    prose_pattern: '(?i)\b(?:aged?|age[ _-]band|years?[ _-]old)\b[^.\n]{0,12}?\b9\b'

# Not a learner term: `adult_required`. The supervision *enum* belongs in
# schemas/calibration.schema.v1.json — listing the permitted values is the contract
# doing its job. What is a data fact is which value this learner takes, and that is
# `learner.supervision` above. FR-P3-NO-LITERALS forbids a contract from carrying a
# learner-age literal or a kit name, not from carrying its own vocabulary.
