# Execution routes — every external capability the run depends on, with the exact
# invocation and the evidence it works.
#
# Rule: help text, installed binaries, and configuration files are never capability
# proof. Each route below carries the command that was actually executed and what
# it returned. Preflight repeats each one for real before generation starts; a
# route that cannot be proven is removed, not assumed.
#
# Every route in this file was proven by real execution on 2026-07-29 in ROOT. The
# worker route was re-proven on 2026-07-31, when it gained the model and effort
# parameters: its earlier proof established that codex ran, not that a routing
# decision could reach it. Each proof carries the date it was executed.

routes_version: '1.0'

# The contract this manifest is validated against. FR-P4-ALL-VALIDATE resolves the
# pairing from this pointer rather than from a list held in the gate, so a new
# manifest cannot be added without one.
schema: schemas/routes.schema.v1.json

proven_on: '2026-07-29'
environment_note: >-
  ROOT is not a git repository and has trust_level "untrusted" inherited from the
  /Users/filipepinto entry in ~/.codex/config.toml. Both facts change the required
  invocation and are why the naive commands fail.

routes:

  - id: worker
    purpose: every bounded model call — authoring, review, acceptance
    command: 'codex exec -s workspace-write --skip-git-repo-check -m <decided_model> -c model_reasoning_effort=<decided_effort>'
    parameters:
      note: >-
        This route owns the channel a routing decision travels down, never the value
        it carries: policy/routing/ decides which model serves which task, and a
        literal model id appears in this file only inside proof, which records what
        was actually executed. Before these two slots existed the command could not
        express a model at all, so executed_model could equal decided_model only by
        coincidence — SEL-EXECUTED-MATCHES-DECIDED was unprovable by construction,
        and the selector deferred under RT-3 had nowhere to send its result.
      decided_model:
        flag: -m
        supplied_by: the routing decision's decided_model, per schemas/routing_decision.schema.v2.json
      decided_effort:
        flag: -c model_reasoning_effort=
        supplied_by: the routing decision's reasoning_effort
    proof:
      executed_on: '2026-07-31'
      executed: 'codex exec -s workspace-write --skip-git-repo-check -m gpt-5.6-luna -c model_reasoning_effort="low" "Reply with exactly: ROUTE_OK"'
      returned: >-
        ROUTE_OK, with the session banner reporting "model: gpt-5.6-luna" and
        "reasoning effort: low" — both parameters reached the runtime and overrode the
        config.toml defaults, which is the capability being proven, not the reply.
    failure_without_flags:
      command: codex exec -s workspace-write
      error: 'Not inside a trusted directory and --skip-git-repo-check was not specified.'
      note: fails before any model call, so a missing flag looks like a model outage
    unavailable_alternatives:
      omitting_the_parameters:
        effect: >-
          the call silently inherits model and model_reasoning_effort from
          ~/.codex/config.toml and runs at that setting whatever the task, which is
          the unbounded-escalation failure SEL-ESCALATION-BOUNDED exists to catch
        note: not an alternative, recorded so the silent path is named
    constraints:
      - '--skip-git-repo-check is required, not optional.'
      - Record the sandbox policy actually used in the route record, beside model and effort.
      - 'Never use --dangerously-bypass-approvals-and-sandbox.'
      - Do not widen the policy beyond what the authorized roots require.
      - >-
        Both parameters are required on every call. A call that omits them inherits a
        default no decision chose, and its routing record cannot be trusted.

  - id: claude_worker
    purpose: every bounded Claude model call — authoring, research, visual drafting, targeted repair
    command: >-
      claude --print --output-format stream-json --verbose --json-schema <cli_schema_projection>
      --model <decided_model> --effort <decided_effort> --permission-mode plan --tools ""
      --add-dir <workspace> --no-session-persistence --setting-sources ""
    parameters:
      note: >-
        This route owns the channel a routing decision travels down, never the value
        it carries, matching the worker route's own convention. The instruction and
        the authorized-input projection are delivered together on stdin as one JSON
        document ({instruction, authorized_input_projection}), never as a positional
        argument or a staged file the worker reads, because --tools "" leaves the
        worker no file-reading tool. --json-schema takes the CLI-schema projection
        inline as JSON text, never a file path or the canonical schema's own
        $schema-bearing form (both rejected live by the installed CLI).
      decided_model:
        flag: --model
        supplied_by: the routing decision's decided_model, per runtime/langgraph_factory/config/model_jobs.v1.yaml
      decided_effort:
        flag: --effort
        supplied_by: the routing decision's reasoning_effort
    proof:
      executed_on: '2026-08-13'
      executed: >-
        printf '%s' '{"instruction":"Write one sentence describing what a lever is,
        suitable for a 10-year-old. Put it in the summary field.",
        "authorized_input_projection":{"topic":"simple machines","grade_band":"4-6"}}'
        | claude --print --output-format stream-json --verbose
        --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},
        "required":["summary"],"additionalProperties":false}'
        --model claude-sonnet-5 --effort high --permission-mode plan --tools ""
        --add-dir /tmp/n20probe --no-session-persistence --setting-sources ""
      returned: >-
        exit 0; stream-json system/init event reported tools=["StructuredOutput"],
        model="claude-sonnet-5"; the per-turn assistant event (parent_tool_use_id
        null) reported message.model="claude-sonnet-5"; the final result event's
        structured_output was {"summary": "A lever is a simple machine — like a
        long bar that rests on a point called a fulcrum — that lets you push down
        on one end to lift something heavy on the other end."}, schema-conformant.
        The same probe run with the real M03_write_unit_content.schema.json's own
        $schema field attached was rejected before execution ("no schema with key
        or ref \"https://json-schema.org/draft/2020-12/schema\""), confirming the
        CLI-schema projection's $schema-stripping step is load-bearing, not
        decorative.
    constraints:
      - Instruction and authorized_input_projection are delivered on stdin, never as a positional argument, because --tools "" leaves the worker no file-reading tool.
      - --json-schema takes the CLI-schema projection inline as JSON text, never a file path; the unmodified canonical schema remains the sole post-execution jsonschema admission authority.
      - Executed identity MUST be read from the stream-json per-turn assistant event's message.model field (parent_tool_use_id null), never from the final envelope's aggregate modelUsage map, which a live probe proved can carry more than one model.
      - --setting-sources "" does not by itself prove MCP isolation; D03 inspects the stream-json init event's tool and MCP-server lists directly (runtime/langgraph_factory/transport.py prove_claude_tool_closure).
      - This proof is a trivial bounded, content-free-of-curriculum probe (spec 7.1 class 4), not a live proof of a real M01-M04/M06/M08 curriculum job; that live proof is N70/N80's responsibility.

  - id: pdf
    purpose: render a lab or the workbook to PDF
    command: 'pandoc <input>.md --pdf-engine=typst -V mainfont="Helvetica" -o <output>.pdf'
    proof:
      executed: 'pandoc t.md --pdf-engine=typst -V mainfont="Helvetica" -o t2.pdf'
      returned: 'valid %PDF-1.7, 11586 bytes'
    failure_without_flags:
      command: 'pandoc t.md -o t.pdf'
      error: 'pdflatex not found. Please select a different --pdf-engine or install pdflatex'
    unavailable_alternatives:
      tex_engines: [pdflatex, xelatex, lualatex, tectonic, context]
      python_libraries: [reportlab, pypdf, fpdf, weasyprint]
      note: only PIL is importable; typst is the sole working engine
    constraints:
      - The font must be named explicitly or typst fails with "font fallback list must not be empty".
      - 'Never fall back to bare `pandoc -o out.pdf`; it cannot work in this environment.'
      - Do not add a Python PDF route unless its dependencies are proven importable by real execution.

  - id: rasterizer
    purpose: turn the shipped PDF into page images for visual QA
    command: 'pdftoppm -r 200 -png <lab>.pdf <outdir>/page'
    proof:
      executed: 'pdftoppm -r 200 -png t2.pdf page'
      returned: 'page-1.png, 1700x2200 px, RGB'
    parameters:
      resolution_dpi: 200
      colour: RGB
      coverage: every page, none sampled or skipped
      naming: "page-<n>.png, poppler's own zero-padding convention"
      hashing: sha256 of each page image recorded in the test result
    constraints:
      - Rasterize the shipped PDF, never a re-render from the typst or markdown source.
        Inspecting a different artifact than the one shipped is the substitution that
        gate B4 exists to catch.
      - A page that cannot be rasterized is a tool-error EXEC record and stops the run.
        It is never treated as a page that passed.

  - id: imagegen
    purpose: polished nontechnical context, mechanism and observation support
    command: null
    proof: null
    status: UNPROVEN
    constraints:
      - No invocation has been proven in this environment. Preflight must establish one
        or remove the route before generation.
      - If the route cannot be proven, the run stops as META_SYSTEM_FAILURE at the
        live-capability gate rather than proceeding without it.
      - ImageGen may never carry exact components, wiring, pinouts, polarity, values,
        geometry or safety evidence, and never substitutes for missing evidence.

preflight:
  rule: >-
    Make one real, minimal, structured call on every route that will be used, under
    the exact command recorded above, before any generation begins. Report actual
    calls by role, model, effort, sandbox policy and elapsed time.
  on_failure: >-
    Remove the unavailable route before generation, or stop as META_SYSTEM_FAILURE
    if the route is required. Never discover a capability failure mid-run.
