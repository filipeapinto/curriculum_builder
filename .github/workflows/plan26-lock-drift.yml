name: plan26-lock-drift

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lock-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # pip-tools 7.6.0 calls RequirementCommand.make_requirement_preparer with
      # the pip 25.x keyword set; pip 26.x changed that signature, so the
      # regenerating pip is pinned alongside pip-tools.
      - name: Install pinned lock generator
        run: python -m pip install "pip==25.3" "pip-tools==7.6.0"

      - name: Regenerate lock and fail on drift
        run: |
          python -m piptools compile --generate-hashes --no-header --strip-extras --output-file requirements/plan26.lock requirements/plan26.in
          git diff --exit-code -- requirements/plan26.lock

      - name: Install hash-verified environment
        run: |
          python -m pip install --upgrade "pip==25.3"
          python -m pip install --require-hashes -r requirements/plan26.lock

      - name: Run Plan 26 dependency and API contract tests
        run: python -m pytest -q tests/runtime/test_plan26_api_contract.py tests/runtime/test_plan26_lock_drift.py
