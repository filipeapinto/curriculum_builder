<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}} — Plan {{VERSION}}</title>
  <style>
    :root{color-scheme:light dark;--bg:#edf2f4;--paper:#fff;--ink:#172630;--muted:#586a75;--line:#c9d5db;--navy:#123b55;--teal:#087d78;--soft:#e5f3f1;--warm:#fff2d2;--red:#8f3045;--shadow:0 12px 34px rgba(18,48,65,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;color:var(--ink);font:16px/1.58 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--teal)}.wrap{width:min(1160px,calc(100% - 34px));margin:auto}.hero{color:#fff;background:linear-gradient(125deg,#102c43,#165567 68%,#087d78)}.hero .wrap{padding:54px 0 40px}.eyebrow{margin:0 0 8px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}h1{max-width:1000px;margin:0;font-size:clamp(2.1rem,5vw,4rem);line-height:1.05}.dek{max-width:900px;color:#e6f2f3;font-size:1.12rem}.meta,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.meta div,.card,.callout,.table-wrap{border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:var(--shadow)}.meta div{border-color:rgba(255,255,255,.35);background:rgba(0,0,0,.13);padding:12px}.meta small{display:block;font-size:.7rem;text-transform:uppercase}.meta strong{display:block}nav{position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line);background:var(--paper)}nav .wrap{display:flex;gap:5px;overflow-x:auto;padding:9px 0}nav a{flex:none;padding:5px 8px;text-decoration:none;font-size:.78rem;font-weight:750}main{padding:20px 0 70px}section{margin:44px 0;scroll-margin-top:55px}h2{margin:0 0 12px;color:var(--navy);font-size:clamp(1.45rem,3vw,2rem)}h3{margin:0 0 7px;color:var(--navy)}p{margin:8px 0}.lead{max-width:960px;color:var(--muted);font-size:1.05rem}.card,.callout{padding:19px}.callout{border-left:7px solid var(--teal)}.callout.warning{border-left-color:#a66b10;background:var(--warm)}.callout.stop{border-left-color:var(--red)}.table-wrap{overflow-x:auto}table{width:100%;min-width:820px;border-collapse:collapse}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft);color:var(--navy);font-size:.73rem;text-transform:uppercase}tr:last-child td{border:0}.steps{counter-reset:item;padding:0}.steps>li{list-style:none;position:relative;margin:12px 0;padding:17px 18px 17px 58px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}.steps>li:before{counter-increment:item;content:counter(item);position:absolute;left:17px;top:17px;width:27px;height:27px;border-radius:50%;background:var(--teal);color:#fff;text-align:center;font-weight:800;line-height:27px}.status{display:inline-block;padding:4px 9px;border-radius:99px;background:var(--warm);color:#6f4a0e;font-weight:850;font-size:.78rem}code{padding:.1em .3em;border-radius:4px;background:var(--soft);font:.88em ui-monospace,monospace;overflow-wrap:anywhere}footer{padding:22px;color:var(--muted);text-align:center}@media(max-width:760px){.meta,.grid{grid-template-columns:1fr}nav{position:relative}}@media(prefers-color-scheme:dark){:root{--bg:#0d1720;--paper:#17242e;--ink:#edf3f5;--muted:#b5c1c8;--line:#3b4d59;--navy:#a6d8e6;--teal:#80d7cf;--soft:#193a3a;--warm:#3d321c;--shadow:none}.status{color:#ffe0a0}}@media print{nav{display:none}.hero{background:#173f55!important;print-color-adjust:exact}.card,.callout,.steps>li,.table-wrap{break-inside:avoid;box-shadow:none}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><p class="eyebrow">{{STATUS}}</p><h1>{{TITLE}}</h1><p class="dek">{{OBJECTIVE}}</p><div class="meta">{{META_CARDS}}</div></div></header>
  <nav aria-label="Plan contents"><div class="wrap">{{NAVIGATION}}</div></nav>
  <main class="wrap">{{PLAN_SECTIONS}}</main>
  <footer>{{TITLE}} · {{VERSION}}</footer>
</body>
</html>
