<h2>Multimeter ports</h2>
<p>On the ACME DM-100 the 10 A socket is used when measuring large currents.</p>
<p>A good-quality breadboard is generally limited to around 2 A.</p>
<p>Each of the rows of 5 holes has internal spring contacts that connect the 5 holes electrically.</p>
