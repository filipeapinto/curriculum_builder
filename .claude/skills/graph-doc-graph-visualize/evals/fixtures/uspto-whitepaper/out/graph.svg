<text x="531.0" y="206.0" font-size="9" fill="#0F172A"><tspan font-weight="600">gate</tspan><tspan fill="#475569"> — deterministic pass / fail</tspan></text>
<text x="501.0" y="244.0" font-size="8" font-weight="700" letter-spacing="1.5" fill="#94A3B8">EDGE TYPE</text>
