<text x="531.0" y="296.0" font-size="9" fill="#475569">parallel fan-out</text>
<path d="M501.0,309.0 L523.0,309.0" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 3"/>
<text x="531.0" y="312.0" font-size="9" fill="#475569">repair back-edge</text>
<text x="501.0" y="350.0" font-size="8" font-weight="700" letter-spacing="1.5" fill="#94A3B8">THE ONE REPAIR ROUTE</text>
<rect x="501.0" y="356.0" width="312.0" height="1" fill="#E2E8F0"/>
<text x="501.0" y="370.0" font-size="8.4" text-anchor="start" font-weight="400" fill="#475569">One crimson lane in the gutter per route, outermost lane = longest</text>
<text x="501.0" y="381.3" font-size="8.4" text-anchor="start" font-weight="400" fill="#475569">reach. Read a lane as: this failure sends the run back there, at most</text>
<text x="501.0" y="392.7" font-size="8.4" text-anchor="start" font-weight="400" fill="#475569">this many times, then the terminal escape takes over.</text>
<text x="501.0" y="410.0" font-size="7.4" font-weight="700" letter-spacing="0.7" fill="#94A3B8">FAILS AT</text><text x="619.0" y="410.0" font-size="7.4" font-weight="700" letter-spacing="0.7" fill="#94A3B8">GOES BACK TO</text><text x="733.0" y="410.0" font-size="7.4" font-weight="700" letter-spacing="0.7" fill="#94A3B8">CLASS</text><text x="813.0" y="410.0" font-size="7.4" font-weight="700" letter-spacing="0.7" text-anchor="end" fill="#94A3B8">MAX</text>
<rect x="501.0" y="415.0" width="312.0" height="1" fill="#E2E8F0"/>
<text x="501.0" y="428.0" font-size="8.6" fill="#0F172A">S6 Review Mechanical</text><text x="619.0" y="428.0" font-size="8.6" fill="#DC2626">S4 Compose</text><text x="733.0" y="428.0" font-size="8.6" fill="#475569">composition</text><text x="813.0" y="428.0" font-size="8.6" text-anchor="end" fill="#475569">×2</text>
<text x="511.0" y="439.0" font-size="7.8" fill="#94A3B8">the memo is malformed or cites nothing</text>
<rect x="481.0" y="501.5" width="352.0" height="167.1" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="501.0" y="537.5" font-size="8" font-weight="700" letter-spacing="1.5" fill="#94A3B8">EXECUTION SHAPE</text>
<rect x="501.0" y="543.5" width="312.0" height="1" fill="#E2E8F0"/>
<text x="501.0" y="557.5" font-size="10.5" text-anchor="start" font-weight="600" fill="#0F172A">fixed linear sequence</text>
<text x="501.0" y="570.5" font-size="8.2" text-anchor="start" font-weight="400" fill="#475569">decisive: single deliverable</text>
<text x="501.0" y="603.6" font-size="8" font-weight="700" letter-spacing="1.5" fill="#94A3B8">STATIC COMPILE CHECKS</text>
<rect x="501.0" y="609.6" width="312.0" height="1" fill="#E2E8F0"/>
<text x="501.0" y="623.6" font-size="9" font-weight="700" fill="#15803D">✓</text><text x="515.0" y="623.6" font-size="8.4" fill="#475569">all outputs reachable</text>
<text x="501.0" y="636.1" font-size="9" font-weight="700" fill="#15803D">✓</text><text x="515.0" y="636.1" font-size="8.4" fill="#475569">every cycle bounded</text>
<rect x="481.0" y="694.6" width="352.0" height="373.7" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="501.0" y="730.6" font-size="8" font-weight="700" letter-spacing="1.5" fill="#94A3B8">STAGE MAP</text>
<rect x="501.0" y="736.6" width="312.0" height="1" fill="#E2E8F0"/>
<text x="501.0" y="750.6" font-size="8.6" font-weight="700" fill="#0F172A">S0</text><text x="527.0" y="750.6" font-size="8.6" fill="#475569">Contract &amp; profile</text>
<text x="527.0" y="761.6" font-size="8" fill="#94A3B8">Contract Compile</text>
<text x="501.0" y="775.6" font-size="8.6" font-weight="700" fill="#0F172A">S4</text><text x="527.0" y="775.6" font-size="8.6" fill="#475569">Native composition</text>
<text x="527.0" y="786.6" font-size="8" fill="#94A3B8">Compose</text>
<text x="501.0" y="800.6" font-size="8.6" font-weight="700" fill="#0F172A">S6</text><text x="527.0" y="800.6" font-size="8.6" fill="#475569">Review &amp; repair</text>
<text x="527.0" y="811.6" font-size="8" fill="#94A3B8">Review Mechanical</text>
<text x="501.0" y="825.6" font-size="8.6" font-weight="700" fill="#0F172A">S7</text><text x="527.0" y="825.6" font-size="8.6" fill="#475569">Contract closure</text>
<text x="527.0" y="836.6" font-size="8" fill="#94A3B8">Closure Receipt</text>
<text x="501.0" y="872.6" font-size="8" font-weight="700" letter-spacing="1.5" fill="#94A3B8">BUDGET CEILING</text>
<rect x="501.0" y="878.6" width="312.0" height="1" fill="#E2E8F0"/>
<text x="501.0" y="892.6" font-size="9" fill="#475569">total cost</text><text x="813.0" y="892.6" font-size="9" text-anchor="end" font-weight="600" fill="#0F172A">$8</text>
<text x="501.0" y="907.6" font-size="9" fill="#475569">total latency</text><text x="813.0" y="907.6" font-size="9" text-anchor="end" font-weight="600" fill="#0F172A">1 h</text>
<text x="501.0" y="922.6" font-size="9" fill="#475569">total retries</text><text x="813.0" y="922.6" font-size="9" text-anchor="end" font-weight="600" fill="#0F172A">4</text>
<text x="501.0" y="937.6" font-size="8.2" text-anchor="start" font-weight="400" fill="#94A3B8">Each card carries its own ceiling: cost · latency · retries.</text>
<text x="501.0" y="971.6" font-size="8" font-weight="700" letter-spacing="1.5" fill="#94A3B8">WHAT THIS PICTURE LEAVES OUT</text>
<rect x="501.0" y="977.6" width="312.0" height="1" fill="#E2E8F0"/>
<text x="501.0" y="991.6" font-size="8.4" text-anchor="start" font-weight="400" fill="#475569">Every node also carries reads, writes, preconditions, postconditions,</text>
<text x="501.0" y="1002.9" font-size="8.4" text-anchor="start" font-weight="400" fill="#475569">an activation guard, permission requirements and an admission reason.</text>
<text x="501.0" y="1014.3" font-size="8.4" text-anchor="start" font-weight="400" fill="#475569">None of that fits on a card without making the card unreadable, and the</text>
<text x="501.0" y="1025.6" font-size="8.4" text-anchor="start" font-weight="400" fill="#475569">manifest already holds it in a form you can grep. Read the picture for</text>
<text x="501.0" y="1036.9" font-size="8.4" text-anchor="start" font-weight="400" fill="#475569">shape and recovery; read the manifest for contracts.</text>
</svg>