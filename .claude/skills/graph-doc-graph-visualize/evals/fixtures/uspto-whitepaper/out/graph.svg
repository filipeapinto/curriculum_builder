<path d="M501.0,261.0 L523.0,261.0" stroke="#64748B" stroke-width="1.6"/>
<text x="531.0" y="264.0" font-size="9" fill="#475569">sequential</text>
<path d="M501.0,277.0 L523.0,277.0" stroke="#15803D" stroke-width="1.6"/>
<text x="531.0" y="280.0" font-size="9" fill="#475569">conditional — fires on pass</text>
