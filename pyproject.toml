[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "curriculum-factory"
version = "0.1.0"
description = "A contract-first, curriculum-neutral pipeline for producing curriculum units from a supplied manifest and curriculum-owned domain rules."
readme = "readme.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
    "Pillow==12.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "libcst==1.8.2",
    "tomlkit==0.15.1",
    "ruamel.yaml==0.19.1",
]

[project.scripts]
curriculum-factory-run-curriculum = "curriculum_factory.run_curriculum:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["curriculum_factory*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml", "*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
