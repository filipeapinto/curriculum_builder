# yaml-language-server: $schema=../../../schemas/prompt.schema.v4.json
title: P00 — Build Refactor Inventory and Behavioral Baseline

authorized_paths:
  - tools/refactor_repo/
  - schemas/repository_refactor_inventory.schema.v1.json
  - tests/refactor_repo/test_inventory.py
  - plans_internal/refactor_repo/inventory/
  - plans_internal/refactor_repo/baseline/
  - plans_internal/refactor_repo/checkpoints/P00/
  - plans_internal/refactor_repo/execution/P00/execution_log.jsonl
  - plans_internal/refactor_repo/execution/P00/.execution_log.counter.json
  - plans_internal/refactor_repo/execution/P00/.execution_log.lock
  - failed_execution_evidence/

model: sonnet

agent:
  execution_path: claude_code_direct
  reasoning: >-
    Model selection: sonnet is explicit because inventory classification and behavioral-baseline synthesis require non-trivial judgment; this is not pure lookup work suitable for haiku.
    Inventory combines Git state, syntax-aware analysis, structured parsing,
    environment observation, and behavioral capture and must preserve the user's
    dirty worktree.

operations:
  executor:
    kind: agent_native
    implementation: runtime.logger.ExecutionLogger
  journal:
    path: plans_internal/refactor_repo/execution/P00/execution_log.jsonl
    schema: schemas/execution_log.schema.v2.json
    format: jsonl
    write_mode: append_only
  action_protocol:
    before_action: append_act_started
    after_success: append_act_completed_closing_start
    after_failure: append_exec_closing_start
  restart:
    detection: compute_unclosed_starts
    no_journal: fresh_start
    closed_action: reuse_if_inputs_unchanged
    unclosed_action: resume_or_idempotently_repeat
  completion_gate:
    require_valid_journal: true
    require_zero_unclosed_starts: true
    require_all_tests_pass: true
    require_authorized_paths_only: true

goal: >-
  Implement a reproducible, read-only, schema-versioned repository inventory and
  capture the pre-refactor behavioral baseline required by specification v8. Inputs
  are the specification, current Git checkout, declared dependencies, installed
  environment, live code/configuration, tests, documentation, and ignored state.
  Do not rename, move, delete, reformat, or repair production material. Stop if a
  required collection source is unavailable, a top-level directory cannot be
  classified, the tool mutates the checkout, or baseline behavior cannot be recorded
  truthfully. The rollback is deletion or Git reversion of only the authorized tool,
  schema, tests, reports, checkpoint, and journal. Passing P00 unblocks only P00A post-inventory decomposition and grants no
  implementation prompt mutation authority.

tests:
  - description: Inventory is read-only and fails closed on incomplete collection
    check: >-
      Run the inventory twice in a clean linked worktree, snapshot tracked, untracked,
      and ignored state before and after, and run a fault-injection case that makes one
      collector unavailable.
    expected: >-
      Successful runs leave the worktree byte-identical; the injected omission is
      named in output and causes a nonzero exit rather than an empty successful field.

  - description: Machine output validates and carries reproducibility metadata
    check: >-
      Validate every generated inventory JSON against
      schemas/repository_refactor_inventory.schema.v1.json and inspect schema version,
      UTC timestamp, commit, dirty state, tool versions, command/configuration,
      omissions, failures, and pip-inspect or equivalent environment inventory.
    expected: >-
      Validation succeeds and every required provenance field is present and truthful.

  - description: Inventory covers the complete specification surface
    check: >-
      Compare the machine report with Git status, top-level directories, AST-derived
      imports and qualified names, structured JSON/YAML/TOML, runtime observations,
      declared dependencies, output children, test subtrees, CI references, schema
      identifiers, __file__ traversals, absolute paths, and old identities.
    expected: >-
      Every discovered item has an owner or reader, lifecycle, tracked/ignored state,
      proposed disposition, and source evidence; unresolved items are explicit and
      make the collection fail.

  - description: Human report and machine report describe the same inventory
    check: >-
      Recompute stable item identifiers from both timestamp-matched reports and compare
      their sets and dispositions.
    expected: >-
      The sets are identical; prose summarizes rather than silently omitting machine
      findings.

  - description: Behavioral baseline is executable and normalization is predeclared
    check: >-
      In an isolated checkout record existing tests and gates, documented commands,
      import origins, CLI help and invalid-input exits, schema resolution, output
      containment, and representative artifact bytes or semantic digests. Re-run the
      comparison using only normalization rules recorded before the second run.
    expected: >-
      Existing failures are separated from passes, nondeterministic fields have narrow
      written normalization rules, and the baseline can distinguish equivalent from
      changed behavior.

  - description: Independent Codex QA accepts the P00 checkpoint
    check: >-
      Create a versioned checkpoint report under
      plans_internal/refactor_repo/checkpoints/P00/ and invoke
      .claude/skills/qa-gate-codex-run/scripts/qa_gate.py with that artifact,
      plans_internal/refactor_repo/prompts/checkpoint_qa_criteria.v1.md as criteria,
      this prompt and refactor_repository.spec.v8.html as grounding, threshold blocker,
      and at most five iterations; follow the skill's versioning protocol and run
      verify after a pass.
    expected: >-
      The sanctioned verify command exits 0 with QA_PASSED, names the witnessed Codex
      session and passing artifact, and leaves the complete transcript in the
      checkpoint QA directory.
    verifier:
      execution_path: codex_plugin
      invokes:
        type: skill
        skill: qa-gate-codex-run
      reasoning: The authoring agent may not assign its own checkpoint verdict.

loop:
  steps:
    - Before constructing ExecutionLogger or writing any file, capture and persist in the first journal action the t=0 tracked, untracked, and ignored path inventory plus byte digests for every pre-existing authorized-path file; then apply the restart protocol and record the initial commit and dirty state.
    - Read specification v8 and derive a versioned inventory schema before implementing collectors.
    - Implement independent collectors and explicit failure aggregation without repository writes.
    - Run inventory and behavioral baseline capture in an isolated checkout.
    - Reconcile human and machine reports; stop on every unresolved classification or collection failure.
    - Run every required test and gate, recording each exact command, exit code, complete output artifact, environment, and resulting digest in the checkpoint and journal; an aggregate claim without per-command evidence fails closed.
    - Immediately before QA, regenerate the checkpoint review surface from the final working-tree state, record its source and output digests, and reject any checkpoint or QA input whose digest predates the latest tracked or untracked mutation.
    - Create the checkpoint report from that current review surface and complete the independent QA gate.
    - Apply every completion gate and identify P01 and P02 as successors only.
  stopping_condition: >-
    Stop successfully only when all six tests pass, inventory collection is complete,
    the journal is valid with zero unclosed starts, scope is clean, and QA verify says
    QA_PASSED. Otherwise stop with the exact missing evidence or failed collector.
  resume_check: >-
    Recompute unclosed journal starts before acting; reuse a closed collector only when
    its commit, configuration, tool versions, and observed input digests are unchanged,
    otherwise rerun it read-only.
  escalation: >-
    After two failures with the same cause, record the unavailable source, affected
    inventory fields, and smallest operator action required; do not fabricate values.
  retry_policy:
    auto_retry: [tool-error, partial-run]
    requires_fix: [missing-input, bad-input, wrong-output, other]
