# yaml-language-server: $schema=../../../../schemas/prompt.schema.v4.json
title: P10 — Authorize and Execute the External Repository Rename

authorized_paths:
  - plans_internal/refactor_repo/external_inventory.v1.yaml
  - plans_internal/refactor_repo/migration_report.P10.addendum.v1.md
  - plans_internal/refactor_repo/checkpoints/P10/
  - plans_internal/refactor_repo/execution/P10/execution_log.jsonl

model: sonnet

agent:
  execution_path: claude_code_direct
  reasoning: >-
    Model selection: sonnet is explicit because external compatibility, authorization, recovery, and observed-state decisions require non-trivial judgment; this is not pure lookup work suitable for haiku.
    External state requires complete read-only discovery, explicit just-in-time user
    authorization, observed integration checks, and a non-Git recovery procedure.

operations:
  executor:
    kind: agent_native
    implementation: curriculum_factory.logger.ExecutionLogger
  journal:
    path: plans_internal/refactor_repo/execution/P10/execution_log.jsonl
    schema: schemas/execution_log.schema.v2.json
    format: jsonl
    write_mode: append_only
  action_protocol:
    before_action: append_act_started
    after_success: append_act_completed_closing_start
    after_failure: append_exec_closing_start
  restart:
    detection: compute_unclosed_starts
    no_journal: fresh_start
    closed_action: always_reverify
    unclosed_action: require_operator_review
  completion_gate:
    require_valid_journal: true
    require_zero_unclosed_starts: true
    require_all_tests_pass: true
    require_authorized_paths_only: true

goal: >-
  After P09 and all executable repository acceptance tests pass, perform read-only
  inventory of clone URLs, badges, Pages/custom domains, webhooks, deploy keys, packages,
  containers, integrations, branch protection, environments, secrets/variables names
  without values, dependency automation, deployment systems, reusable workflows,
  Marketplace publication, and every GitHub Actions uses: owner/repository@ref consumer.
  Record owners, access, old/new values, redirect behavior, compatibility, validation,
  reversal/recovery, and especially action consumers that do not receive ordinary rename
  redirects. Confirm the old repository name will not be reused. Then stop and request
  explicit user authorization for the exact remote repository, local checkout, origin,
  downstream remotes, integration changes, validation push, and temporary-branch cleanup.
  Creation or execution of this prompt is not that authorization. After approval only,
  rename to curriculum_factory, update origin/clone consumers/integrations, exercise
  clone/fetch/push and every applicable integration, and record observed results and
  rollback status. Never read or log secret values. Non-targets are repository source,
  tests, schemas, history rewriting, and unlisted external systems. Stop on incomplete
  inventory, missing authority, action-consumer incompatibility without a plan, uncertain
  rollback, or any target not named in the approval.

tests:
  - description: P09 and every repository acceptance criterion are witnessed passes
    check: >-
      Verify P00-P09 sanctioned QA results, rerun the final clean-room suite at the exact
      candidate commit, and reconcile all 20 specification acceptance criteria with the
      prompt manifest and migration report/addenda.
    expected: >-
      Every executable criterion passes with evidence; no pending repository fix or
      ignored local dependency remains before external mutation is requested.

  - description: External inventory is complete and avoids secret values
    check: >-
      Compare provider/API/CLI read-only results and live repository references with all
      external categories in specification §11; inspect the inventory for secret payloads.
    expected: >-
      Every applicable system and owner is recorded with configuration names/status but
      no secret value; omissions or inaccessible systems prevent completion.

  - description: Compatibility and recovery plan covers every external target
    check: >-
      For each inventory entry verify old/new value, redirect behavior, GitHub Actions
      uses compatibility, update owner/order, validation, rollback/recovery, and old-name
      reuse policy.
    expected: >-
      Every mutation has a named recovery path; action references have explicit updates
      or compatibility; old-name non-reuse is confirmed for redirect lifetime.

  - description: Exact external mutations have explicit just-in-time authorization
    check: >-
      Preserve the user's approval message and compare its repository identifier, local
      path, integrations, validation push, and cleanup targets with the frozen external
      inventory immediately before the first write action.
    expected: >-
      Approval explicitly covers every intended external mutation; absent, ambiguous,
      stale, or narrower approval causes a stop with no external change.

  - description: Rename and integration validation are observed and recoverable
    check: >-
      After authorization, observe the new remote/local identities, origin and downstream
      remotes, fresh clone, fetch, temporary validation push and cleanup, Pages/badges/
      webhooks/packages/automation/integrations, redirect behavior, and action consumers;
      record exact results without credentials.
    expected: >-
      Every applicable check succeeds or is rolled back through its recorded procedure;
      no target is left in an unknown mixed state.

  - description: Final external addendum reports truthfully complete or recovered state
    check: >-
      Reconcile migration_report.P10.addendum.v1.md with journaled actions, provider
      observations, inventory, approval scope, validation outputs, and recovery actions.
    expected: >-
      The addendum states final identities and status for every target, exceptions and
      pending owner actions, and never reports an unobserved success.

  - description: Independent Codex QA accepts the P10 checkpoint
    check: >-
      Gate a versioned P10 checkpoint report with qa-gate-codex-run using shared criteria
      and this prompt, P00-P09 evidence, external inventory, explicit approval record,
      observed validations/recovery, final addendum, and specification v8 as grounding;
      threshold blocker, at most five iterations, then verify.
    expected: The witnessed verify result is QA_PASSED and identifies the passing artifact.
    verifier:
      execution_path: codex_plugin
      invokes:
        type: skill
        skill: qa-gate-codex-run
      reasoning: High-impact external state changes require an independent witnessed verdict.

loop:
  steps:
    - Apply restart handling and verify P09 plus the final clean-room acceptance state.
    - Inventory all external systems read-only and freeze the compatibility/recovery map.
    - Stop and request explicit authorization naming every proposed external mutation.
    - After authorization, revalidate scope and execute one journaled mutation at a time.
    - Validate clone, fetch, push, cleanup, redirects, actions, and each applicable integration.
    - Recover immediately on a failed target and do not continue into dependent targets.
    - Write the final addendum, complete independent QA, and apply all completion gates.
  stopping_condition: >-
    Stop successfully only when all seven tests pass, authorization exactly covers the
    actions, all external targets are observed in complete or recovered state, the
    journal/scope gates pass, and QA verify says QA_PASSED. Without authorization, stop
    safely as pending authorization rather than pass or fail.
  resume_check: >-
    Re-read provider state and compare with the last closed journal action before every
    resumed external mutation; an unclosed action requires operator review and observed
    reconciliation, never blind repetition.
  escalation: >-
    Stop immediately on missing authority, incomplete inventory, secret exposure risk,
    incompatible action consumer, or uncertain recovery. Request the smallest exact
    owner decision needed and make no further external change.
  retry_policy:
    auto_retry: [tool-error]
    requires_fix: [missing-input, bad-input, wrong-output, partial-run, other]
