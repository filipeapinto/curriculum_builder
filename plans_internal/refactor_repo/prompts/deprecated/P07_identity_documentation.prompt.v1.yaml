# yaml-language-server: $schema=../../../../schemas/prompt.schema.v4.json
title: P07 — Close Product Identity and Live Documentation References

authorized_paths:
  - readme.md
  - docs/
  - meta_prompt/docs/
  - pyproject.toml
  - src/curriculum_factory/langgraph_factory/egress.py
  - .github/workflows/
  - tests/refactor_repo/test_reference_integrity.py
  - tests/refactor_repo/test_documented_commands.py
  - plans_internal/refactor_repo/exceptions/identity_and_paths.v1.yaml
  - plans_internal/refactor_repo/checkpoints/P07/
  - plans_internal/refactor_repo/execution/P07/execution_log.jsonl

model: opus

agent:
  execution_path: claude_code_direct
  reasoning: >-
    Identity cleanup must distinguish human names, repository/distribution/package
    tokens, historical records, URLs, commands, and versioned schema contracts.

operations:
  executor:
    kind: agent_native
    implementation: curriculum_factory.logger.ExecutionLogger
  journal:
    path: plans_internal/refactor_repo/execution/P07/execution_log.jsonl
    schema: schemas/execution_log.schema.v2.json
    format: jsonl
    write_mode: append_only
  action_protocol:
    before_action: append_act_started
    after_success: append_act_completed_closing_start
    after_failure: append_exec_closing_start
  restart:
    detection: compute_unclosed_starts
    no_journal: fresh_start
    closed_action: reuse_if_inputs_unchanged
    unclosed_action: resume_or_idempotently_repeat
  completion_gate:
    require_valid_journal: true
    require_zero_unclosed_starts: true
    require_all_tests_pass: true
    require_authorized_paths_only: true

goal: >-
  After P04 and P06 pass, apply the identity map to live human-facing documentation,
  packaging prose/metadata, commands, paths, badges/URLs, and the known live egress
  reference surface: product Curriculum Factory, repository curriculum_factory,
  distribution curriculum-factory, package curriculum_factory, source root
  src/curriculum_factory. Use structured parsers for TOML/YAML and syntax-aware edits
  for Python; use regex only for discovery and narrowly bounded prose/literals followed
  by human review. Preserve schema $id values exactly per P06, preserve historical and
  deprecated records unless active behavior consumes them, and record each intentional
  legacy name with location, consumer, rationale, and removal condition. Do not rename
  the remote/local checkout, move tests, clean outputs, or rewrite historical plans and
  research. Stop on ambiguous meaning or a required path outside authorized_paths.
  Rollback reverts this checkpoint and reruns P04/P06 checks. P07 unblocks P08.

tests:
  - description: Identity tokens are correct in each live context
    check: >-
      Parse pyproject, workflow files, Python literals, HTML, and Markdown; classify each
      product/repository/distribution/package/source token by context and compare with the
      specification identity map.
    expected: >-
      Every live occurrence uses its context-correct value and no mechanical replacement
      has confused hyphenated distribution, underscored package/repository, or prose name.

  - description: Residual legacy references are absent or fully excepted
    check: >-
      Combine lexical search, structured parsing, link/path extraction, and P00/P06
      inventories across live code, automation, documentation, and configuration; compare
      residual old identities and runtime paths with identity_and_paths.v1.yaml.
    expected: >-
      Every residual is either removed or has exact location, active consumer, rationale,
      and testable removal condition; schema IDs match P06 and are never treated as prose.

  - description: Documented paths and commands execute as written
    check: >-
      Extract live local paths and shell/module/console commands from readme and active
      docs, resolve paths, and execute safe help, validation, build, install, and test
      forms in the stated environment from both checkout and external working directory.
    expected: >-
      Paths resolve, commands use curriculum_factory/curriculum-factory correctly and
      produce documented help/exit behavior; unavailable external operations are marked
      pending P10 rather than falsely passing.

  - description: URLs and external-reference edits receive human semantic review
    check: >-
      Produce a review list for each changed badge, clone URL, Pages/custom-domain link,
      GitHub Actions uses reference, public identifier, or dynamically constructed path;
      compare target existence where read-only access permits.
    expected: >-
      Every changed external/dynamic reference has recorded intent and evidence; items
      requiring the future remote rename remain explicit P10 dependencies.

  - description: Transformation is scoped and does not alter historical contracts
    check: >-
      Compare final diff with authorized paths, inspect docs/deprecated and historical
      content, recompute P06 schema digests, and scan for broad formatting churn.
    expected: >-
      Only intended live references changed, deprecated/history and schema bytes are
      untouched, and no unrelated formatting churn appears.

  - description: Independent Codex QA accepts the P07 checkpoint
    check: >-
      Gate a versioned P07 checkpoint report with qa-gate-codex-run using shared criteria
      and this prompt, identity/ref inventories, exceptions, command/link evidence, P06
      decisions, and specification v8 as grounding; threshold blocker, five iterations
      maximum, then verify.
    expected: The witnessed verify result is QA_PASSED and identifies the passing artifact.
    verifier:
      execution_path: codex_plugin
      invokes:
        type: skill
        skill: qa-gate-codex-run
      reasoning: Semantic identity/reference closure requires independent review.

loop:
  steps:
    - Apply restart handling and verify P04/P06 with unchanged identity inputs.
    - Freeze context-classified targets, non-targets, and exceptions before edits.
    - Apply parser-based code/config changes and bounded, human-reviewed prose edits.
    - Run identity, residual, schema-digest, path, command, URL, and scope tests.
    - Record the rollback checkpoint and complete independent QA.
    - Apply completion gates and identify P08 as successor.
  stopping_condition: >-
    Stop successfully only when all six tests pass, residuals are closed or excepted,
    schema/history is unchanged, scope/journal gates pass, and QA verify says QA_PASSED.
  resume_check: >-
    Recompute target and exception sets and compare P04/P06 evidence digests before
    reusing any closed edit or documentation execution result.
  escalation: >-
    Stop on ambiguous identity meaning, unreachable required URL, or unauthorized live
    consumer; report the exact occurrence and smallest owner decision needed.
  retry_policy:
    auto_retry: [tool-error, partial-run]
    requires_fix: [missing-input, bad-input, wrong-output, other]
