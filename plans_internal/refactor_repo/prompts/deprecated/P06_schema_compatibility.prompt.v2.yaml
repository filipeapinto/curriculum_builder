# yaml-language-server: $schema=../../../../schemas/prompt.schema.v4.json
title: P06 — Preserve Schema Identity and Close Live References

authorized_paths:
  - plans_internal/refactor_repo/schema_identity_decisions.v1.yaml
  - plans_internal/refactor_repo/exceptions/schema_identity.v1.yaml
  - tests/refactor_repo/test_schema_identity.py
  - plans_internal/refactor_repo/checkpoints/P06/
  - plans_internal/refactor_repo/execution/P06/execution_log.jsonl

model: sonnet

agent:
  execution_path: claude_code_direct
  reasoning: >-
    Model selection: sonnet is explicit because schema-contract compatibility and consumer-absence decisions require non-trivial judgment; this is not pure lookup work suitable for haiku.
    Existing schema identifiers are versioned contracts, not branding strings; default
    to preservation and prove every decision and reference resolution.

operations:
  executor:
    kind: agent_native
    implementation: curriculum_factory.logger.ExecutionLogger
  journal:
    path: plans_internal/refactor_repo/execution/P06/execution_log.jsonl
    schema: schemas/execution_log.schema.v2.json
    format: jsonl
    write_mode: append_only
  action_protocol:
    before_action: append_act_started
    after_success: append_act_completed_closing_start
    after_failure: append_exec_closing_start
  restart:
    detection: compute_unclosed_starts
    no_journal: fresh_start
    closed_action: reuse_if_inputs_unchanged
    unclosed_action: resume_or_idempotently_repeat
  completion_gate:
    require_valid_journal: true
    require_zero_unclosed_starts: true
    require_all_tests_pass: true
    require_authorized_paths_only: true

goal: >-
  After P04 passes, inventory every live schema in repository and packaged-resource
  locations and record a preserve-or-version decision for each $id, every external or
  local $ref, registries, fixtures, documentation consumers, publication evidence, and
  compatibility risk. Preserve an existing $id when filename version and semantic
  contract are unchanged, even when its URI contains curriculum_builder. Do not edit a
  live schema, rewrite a published identifier for branding, or create a new version in
  this prompt. If reference analysis proves a schema contract must change, stop and
  require a separately scoped migration prompt with exact old/new mapping. Implement
  automated resolution and ledger-coverage tests. Non-targets are product prose,
  Python imports, resources, outputs, and external rename. Rollback reverts only the
  ledger/tests and reruns the P04 checkpoint. P06 unblocks P07 and P08.

tests:
  - description: Ledger covers every live schema exactly once
    check: >-
      Discover live JSON Schemas through structured parsing across schemas/,
      curricula/, and installed package resources; compare canonical paths and $id
      values with schema_identity_decisions.v1.yaml.
    expected: >-
      Every live schema has exactly one decision entry and no ledger entry points to a
      missing, deprecated, generated, or non-schema file.

  - description: Every identifier decision follows the versioned-contract rule
    check: >-
      For each entry inspect filename version, semantic contract diff/history,
      repository references, documented/public consumers, and claimed consumer absence.
    expected: >-
      Unchanged versions are preserved; any proposed new namespace is limited to a new
      version; consumer-absence claims have reproducible evidence; uncertainty preserves
      the identifier and is recorded.

  - description: Live references resolve in source and installed contexts
    check: >-
      Build resolver registries from canonical live schemas and validate every external
      and local $ref plus representative fixtures from both the repository data root and
      installed package-resource context.
    expected: >-
      All references resolve to the intended live contract without network access,
      deprecated fallback, or accidental duplicate identifier.

  - description: Tests detect unrecorded and unsafe identity changes
    check: >-
      In disposable copies seed an unledgered schema, mutate a preserved $id, add a
      dangling $ref, duplicate an $id, and claim an unsupported consumer absence.
    expected: Each seeded defect causes a focused nonzero failure naming schema and rule.

  - description: Independent Codex QA accepts the P06 checkpoint
    check: >-
      Gate a versioned P06 checkpoint report with qa-gate-codex-run using shared criteria
      and this prompt, schema inventory, decision evidence, resolution and seeded-defect
      results, and specification v8 as grounding; threshold blocker, five iterations
      maximum, then verify.
    expected: The witnessed verify result is QA_PASSED and identifies the passing artifact.
    verifier:
      execution_path: codex_plugin
      invokes:
        type: skill
        skill: qa-gate-codex-run
      reasoning: Compatibility-sensitive preserve/change decisions require independent QA.

loop:
  steps:
    - Apply restart handling and verify P04 plus unchanged schema inputs from current inventory.
    - Discover schemas and references structurally; freeze the live set before decisions.
    - Record evidence-backed preserve-or-version decisions without editing contracts.
    - Implement and run coverage, resolution, duplicate, mutation, and dangling-reference tests.
    - Stop and request a new scoped prompt if any live contract truly requires versioning.
    - Record rollback verification and complete independent QA.
    - Apply completion gates and identify P07/P08 as successors.
  stopping_condition: >-
    Stop successfully only when all five tests pass, every live schema has a defensible
    decision, all refs resolve, no schema was edited, scope/journal gates pass, and QA
    verify says QA_PASSED.
  resume_check: >-
    Recompute the live schema/$ref set and compare file digests with journaled inputs
    before reusing any decision or resolver result.
  escalation: >-
    Stop on ambiguous contract semantics, unprovable consumer absence, or a required
    schema edit; report the exact contract and new-prompt boundary.
  retry_policy:
    auto_retry: [tool-error, partial-run]
    requires_fix: [missing-input, bad-input, wrong-output, other]
