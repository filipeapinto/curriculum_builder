# yaml-language-server: $schema=../../../schemas/prompt.schema.v4.json
title: P08 — Prove the Refactor in a Clean-Room Release Checkpoint

authorized_paths:
  - tools/refactor_repo/verify_release.py
  - tests/refactor_repo/release/
  - plans_internal/refactor_repo/rollback_map.v1.md
  - plans_internal/refactor_repo/migration_report.v1.md
  - plans_internal/refactor_repo/release_evidence/
  - plans_internal/refactor_repo/checkpoints/P08/
  - plans_internal/refactor_repo/execution/P08/execution_log.jsonl

model: sonnet

agent:
  execution_path: claude_code_direct
  reasoning: >-
    Model selection: sonnet is explicit because release evidence synthesis, differential analysis, and rollback assessment require non-trivial judgment; this is not pure lookup work suitable for haiku.
    Release claims must be reproduced from a clean checkout with only documented
    dependencies and compared with the frozen behavioral baseline.

operations:
  executor:
    kind: agent_native
    implementation: curriculum_factory.logger.ExecutionLogger
  journal:
    path: plans_internal/refactor_repo/execution/P08/execution_log.jsonl
    schema: schemas/execution_log.schema.v2.json
    format: jsonl
    write_mode: append_only
  action_protocol:
    before_action: append_act_started
    after_success: append_act_completed_closing_start
    after_failure: append_exec_closing_start
  restart:
    detection: compute_unclosed_starts
    no_journal: fresh_start
    closed_action: always_reverify
    unclosed_action: resume_or_idempotently_repeat
  completion_gate:
    require_valid_journal: true
    require_zero_unclosed_starts: true
    require_all_tests_pass: true
    require_authorized_paths_only: true

goal: >-
  After P00A assigns this prompt the complete CLI and codemod-safety acceptance
  criteria and P02/P02S/P05/P06/P07 pass, implement a deterministic release-verification harness
  and prove the repository refactor from a clean linked worktree containing no ignored
  or untracked local material and provisioned only through documented dependencies.
  Build and inspect wheel/sdist, install the wheel in a fresh environment, run imports,
  every documented console entry point and module command with its expected arguments,
  help, valid paths, and invalid-input exit behavior, package resources, repository data roots, schema resolution, output containment,
  empty-output suite/gates, reference/documentation checks, and behavioral differential
  against P00 using only predeclared normalization. Write a rollback map and migration
  report covering repository phases, final identities, directory dispositions, removed
  outputs, retained evidence, tests, exceptions, and pending P09/P10 operations. Do not
  modify production, tests outside the new release harness, existing phase evidence, or
  external systems. Stop on any undeclared dependency, ignored-state reliance, baseline
  mismatch, test weakening, or required unauthorized fix. Rollback reverts only this
  verification/report checkpoint. Passing P08 unblocks P09.

tests:
  - description: Resolved manifest grants exact non-overlapping mutation ownership
    check: >-
      Load prompts/resolved/prompt_manifest.resolved.v1.yaml, verify it activates this
      exact prompt version, expand its path plus structured-key, symbol, transformation-
      class, move-operation, or external-target selectors, and compare those units with
      the planned and final diff/action journal plus every other active prompt's units.
    expected: >-
      Every intended and actual mutation unit is owned by this prompt exactly once; no
      unit is unowned, shared, borrowed from a successor, or merely covered by a broader
      authorized path.

  - description: Clean checkout contains no local-material dependency
    check: >-
      Create a clean linked worktree at the exact candidate commit, assert no untracked
      or ignored files, create a fresh environment, install only documented build/runtime/
      test dependencies, and record every provisioning command and version.
    expected: >-
      Provisioning succeeds without copying from the dirty checkout, undeclared local
      files, global import paths, or hidden generated outputs.

  - description: Distribution artifacts are complete and installable
    check: >-
      Build wheel and sdist, inspect metadata/file lists, install only the wheel, then
      from outside checkout test representative imports, module origins, all declared
      console/module help and invalid-input exits, and every package-owned resource.
    expected: >-
      Artifacts build; metadata/file lists match policy; installed modules resolve only
      from the fresh environment; CLIs/resources work without checkout path injection.

  - description: Repository contracts and output boundary work from explicit data root
    check: >-
      Exercise policy, schemas, curricula, documented commands, schema reference
      resolution, internal output creation, and external/symlink traversal rejection
      against a clean repository data root.
    expected: >-
      All repository-owned inputs resolve through the explicit root and all output
      escapes fail before mutation.

  - description: Full tests and gates pass with outputs empty
    check: >-
      Confirm outputs has no generated children, run the entire documented suite and
      repository gates without test selection weakening, then compare collected tests
      and commands with P00 and phase checkpoints.
    expected: >-
      All expected tests are collected and pass; no skipped/xfail/removed assertion was
      introduced to accommodate migration; output remains disposable.

  - description: Behavioral differential matches the frozen baseline
    check: >-
      Compare CLI interfaces/exits and representative public artifact bytes or semantic
      digests with P00 using exactly its predeclared normalization rules; report all
      differences before classification.
    expected: >-
      Intended-equivalent behavior matches; intentional identity/path changes are
      enumerated and traceable; no post-hoc normalization suppresses a mismatch.

  - description: Rollback map and migration report are complete and evidence-linked
    check: >-
      Compare both documents with P00-P07 and P02S journals/checkpoints, prompt manifest,
      acceptance mapping, git history/diff, exceptions, output dispositions, and pending
      P09/P10 work.
    expected: >-
      Every repository phase has a reversal and verification checkpoint; report claims
      link to evidence; external/test-tree work is explicitly pending, not misreported.

  - description: Release harness detects contamination and regression
    check: >-
      In disposable copies seed an ignored fixture dependency, checkout import leak,
      missing package resource, stale command, output escape, schema mismatch, and
      behavioral digest change.
    expected: Every seeded defect causes a focused nonzero release failure.

  - description: Python and structured-data codemod safety passes as one criterion
    check: >-
      Run the complete P02 and P02S fixture suites, pinned-version checks, write-free
      dry-runs, deterministic-output comparisons, second-application idempotence tests,
      unsafe/ambiguous diagnostics, and residual-old/unexpected-new-reference
      postconditions against the inventory-resolved live change surface.
    expected: >-
      Python, TOML, JSON, and YAML transformations all pass; the combined evidence
      satisfies specification acceptance criterion 18 without splitting primary ownership.

  - description: Independent Codex QA accepts the P08 checkpoint
    check: >-
      Gate a versioned P08 checkpoint report with qa-gate-codex-run using shared criteria
      and this prompt, P00-P07 and P02S witnessed evidence, clean-room transcripts, artifacts,
      differential, rollback map, migration report, and specification v8 as grounding;
      threshold blocker, at most five iterations, then verify.
    expected: The witnessed verify result is QA_PASSED and identifies the passing artifact.
    verifier:
      execution_path: codex_plugin
      invokes:
        type: skill
        skill: qa-gate-codex-run
      reasoning: Release-readiness must be judged independently from the implementation agent.

loop:
  steps:
    - Apply restart handling, verify P00A activation and sole CLI/codemod-safety criterion ownership, then verify P02/P02S/P05-P07 plus their immutable evidence digests.
    - Implement the release harness without touching production or existing tests.
    - Provision a clean linked worktree and fresh environment from documented inputs only.
    - Run artifacts, origins, CLIs, resources, roots, outputs, schemas, docs, full suite, gates, and differential checks.
    - Run seeded-defect tests and write evidence-linked rollback and migration reports.
    - Gate the checkpoint independently and apply all completion gates.
    - Identify P09 as the only successor; do not authorize external actions.
  stopping_condition: >-
    Stop successfully only when all ten tests pass in clean room, all seeded defects
    are caught, reports are complete, scope/journal gates pass, and QA verify says
    QA_PASSED.
  resume_check: >-
    Recreate the clean worktree/environment or prove their commit, dependency, and state
    digests unchanged; release checks are always reverified after any prerequisite change.
  escalation: >-
    Stop on any undeclared dependency, contamination, behavioral mismatch, or production
    fix requirement; identify the owning predecessor prompt instead of expanding scope.
  retry_policy:
    auto_retry: [tool-error, partial-run]
    requires_fix: [missing-input, bad-input, wrong-output, other]
