# yaml-language-server: $schema=../../../schemas/prompt.schema.v4.json
title: P09 — Organize the Test Tree from Collected Evidence

authorized_paths:
  - tests/runtime/
  - tests/unit/
  - tests/integration/
  - tests/acceptance/
  - tests/conftest.py
  - .github/workflows/plan26-lock-drift.yml
  - tests/run_gates.sh
  - plans_internal/refactor_repo/test_tree_decision.v1.yaml
  - plans_internal/refactor_repo/migration_report.P09.addendum.v1.md
  - plans_internal/refactor_repo/checkpoints/P09/
  - plans_internal/refactor_repo/execution/P09/execution_log.jsonl
  - plans_internal/refactor_repo/execution/P09/.execution_log.counter.json
  - plans_internal/refactor_repo/execution/P09/.execution_log.lock

model: sonnet

agent:
  execution_path: claude_code_direct
  reasoning: >-
    Model selection: sonnet is explicit because evidence-based test classification, shadowing analysis, and CI ownership require non-trivial judgment; this is not pure lookup work suitable for haiku.
    Test organization follows installed-package parity and measured scope, fixtures,
    cost, environment, and CI evidence; it must never mirror the production package name.

operations:
  executor:
    kind: agent_native
    implementation: curriculum_factory.logger.ExecutionLogger
  journal:
    path: plans_internal/refactor_repo/execution/P09/execution_log.jsonl
    schema: schemas/execution_log.schema.v2.json
    format: jsonl
    write_mode: append_only
  action_protocol:
    before_action: append_act_started
    after_success: append_act_completed_closing_start
    after_failure: append_exec_closing_start
  restart:
    detection: compute_unclosed_starts
    no_journal: fresh_start
    closed_action: reuse_if_inputs_unchanged
    unclosed_action: require_operator_review
  completion_gate:
    require_valid_journal: true
    require_zero_unclosed_starts: true
    require_all_tests_pass: true
    require_authorized_paths_only: true

goal: >-
  Only after P00A activates this prompt, P02S passes for structured YAML changes, and P08 clean-room installed-package parity passes, classify every current
  tests/runtime test by tested scope, shared fixtures, execution cost, environment/
  network/model requirements, CI lane, and direct references. Decide with recorded
  evidence either to retain tests/runtime when runtime remains an accurate domain label
  and the directory cannot resolve as a top-level import, or move tests into non-package-
  mirroring tests/unit, tests/integration, and tests/acceptance groups. Never create or
  rename to tests/curriculum_factory. If moving, update discovery, imports, fixture paths,
  scripts, internal path assertions, and the Plan 26 workflow in this checkpoint only,
  using the pinned P02S YAML codemod with dry-run, fixtures, deterministic output,
  idempotence, unsafe diagnostics, and residual postconditions. Do not edit pyproject.toml;
  P01 owns it and must use discovery rooted broadly enough for either evidence-supported layout.
  Do not modify production, package resources, schemas, fixtures' semantic content,
  output disposition, or external systems. Stop if classification is incomplete, a test
  would be weakened, or a direct reference requires an unauthorized file. Rollback uses
  an exact old/new path map or checkpoint revert and reruns P08. P09 unblocks P10.

tests:
  - description: Resolved manifest grants exact non-overlapping mutation ownership
    check: >-
      Load prompts/resolved/prompt_manifest.resolved.v1.yaml, verify it activates this
      exact prompt version, expand its path plus structured-key, symbol, transformation-
      class, move-operation, or external-target selectors, and compare those units with
      the planned and final diff/action journal plus every other active prompt's units.
    expected: >-
      Every intended and actual mutation unit is owned by this prompt exactly once; no
      unit is unowned, shared, borrowed from a successor, or merely covered by a broader
      authorized path.

  - description: Every test and subtree has complete decision evidence
    check: >-
      Compare collected test files with test_tree_decision.v1.yaml and verify scope,
      shared fixtures, measured cost, environment needs, CI lane, direct references,
      chosen destination/retention, and rationale for each entry.
    expected: >-
      Sets are identical, measurements are current, and no test is classified by name
      alone or left unresolved.

  - description: Selected layout is non-shadowing in all required working directories
    check: >-
      From repository root, each test directory, and an external working directory in a
      fresh installed environment import curriculum_factory and probe runtime plus every
      test-tree directory as a potential top-level production package.
    expected: >-
      curriculum_factory always resolves only from the installed distribution; runtime
      and test-tree paths never resolve as production; no tests/curriculum_factory exists.

  - description: Discovery and direct references agree with the selected layout
    check: >-
      Compare before/after collected test IDs, then inspect pyproject, workflow, gate
      script, fixtures, imports, path assertions, and every P00/P08 direct reference for
      stale old test paths or missing new paths.
    expected: >-
      Test ID coverage is equivalent, all references agree, and the Plan 26 workflow
      invokes its intended tests at their selected locations.

  - description: Tests preserve semantics, fixtures, and CI lanes
    check: >-
      Run each classified lane, the full suite/gates, and P08 clean-room verification;
      compare assertions, markers, fixtures, skips/xfails, collection count, and outcomes
      with the P08 baseline using the path map only.
    expected: >-
      All tests pass with equivalent semantics and no weakening, hidden deselection,
      fixture duplication, or environment-lane drift.

  - description: Move or retention is idempotent and independently revertible
    check: >-
      Reapply the path/reference transformation in dry-run mode, verify an empty diff,
      rehearse the inverse path map in a disposable checkout, and rerun discovery plus
      shadowing checks after rollback.
    expected: >-
      Second application is empty and rollback restores the P08 layout and results.

  - description: Independent Codex QA accepts the P09 checkpoint
    check: >-
      Gate a versioned P09 checkpoint report with qa-gate-codex-run using shared criteria
      and this prompt, decision ledger, path map, shadowing/discovery/CI/rollback evidence,
      P08 results, and specification v8 as grounding; threshold blocker, at most five
      iterations, then verify.
    expected: The witnessed verify result is QA_PASSED and identifies the passing artifact.
    verifier:
      execution_path: codex_plugin
      invokes:
        type: skill
        skill: qa-gate-codex-run
      reasoning: Test movement and shadowing claims require an independent checkpoint verdict.

loop:
  steps:
    - Apply restart handling, verify P00A activation/ownership and P02S, then verify P08 installed-package parity and clean-room evidence.
    - Measure and freeze the complete test classification and direct-reference map.
    - Choose retention or a non-package-mirroring layout from evidence and record the decision.
    - If moving, apply the exact path map and update only authorized discovery/reference files.
    - Run origin/shadowing, collection, lane, full-suite, clean-room, idempotence, and rollback tests.
    - Write the P09 migration-report addendum and complete independent QA.
    - Apply completion gates and identify P10 as successor.
  stopping_condition: >-
    Stop successfully only when all seven tests pass, every test is classified, import
    shadowing is rejected, semantics are preserved, scope/journal gates pass, and QA
    verify says QA_PASSED.
  resume_check: >-
    Recompute the current path map and compare test/reference digests before acting; an
    unclosed move requires operator review and exact source/destination reconciliation.
  escalation: >-
    Stop on incomplete classification, ambiguous CI ownership, test weakening, or an
    unauthorized direct reference; do not force a preferred directory taxonomy.
  retry_policy:
    auto_retry: [tool-error]
    requires_fix: [missing-input, bad-input, wrong-output, partial-run, other]
